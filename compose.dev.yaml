# Dev-only Postgres, on 5434 so it fights neither a local install (5432)
# nor the sealant dev Postgres (5433) on the same machine. Tests use their
# own Postgres on 5435 (`postgres-test`), which keeps nothing.
# The product compose (mend + postgres + Sealant env) is compose.yaml; the
# distinct project name keeps the two stacks from recreating each other.
#
#   docker compose -f compose.dev.yaml up -d
#
# `garage` is the dev bucket for the capture store (ADR-0002), the store
# every install runs since decision 8: S3 on 3900, single node, bucket
# `mend`, key `mend-dev` — laid out once by `deploy/dev/garage-init.sh` (the
# image ships no shell, so the init runs from the host through
# `docker compose exec`). `pnpm dev` runs it unless MEND_SESSION_STORE=colocated
# opts back into the deprecated co-located store (DEVELOPMENT.md
# §Environment). The shipped bundle runs the same Garage beside `mend-store`
# (deploy/docker/compose.v2.yaml).
name: mend-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mend
      POSTGRES_PASSWORD: mend
      POSTGRES_DB: mend
    ports:
      - "5434:5432"
    volumes:
      - mend-dev-pgdata:/var/lib/postgresql/data
    # `pnpm dev` runs `up -d --wait`; the healthcheck is what --wait gates on.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mend -d mend"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The tests' Postgres. Every test file makes and drops its own database, and
  # Postgres waits on a checkpoint for each DROP DATABASE that flushes every
  # file any other test dirtied: with fsync on, cleanup hooks ran past their
  # 10 s under parallel files (SLNT-764). Without fsync and a volume, a crash
  # loses only throwaway databases; the dev data above keeps its fsync.
  postgres-test:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: mend
      POSTGRES_PASSWORD: mend
      POSTGRES_DB: mend
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mend -d mend"]
      interval: 2s
      timeout: 3s
      retries: 15

  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
    volumes:
      - ./deploy/dev/garage.toml:/etc/garage.toml:ro
      - mend-dev-garage-meta:/var/lib/garage/meta
      - mend-dev-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mend-dev-pgdata:
  mend-dev-garage-meta:
  mend-dev-garage-data:

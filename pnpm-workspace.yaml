  "@types/node": ^22.10.2
  "@types/pg": ^8.11.10
  "@types/qrcode": ^1.5.5
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.1.4
  better-auth: 1.6.23
  drizzle-orm: 1.0.0-rc.5-5935859
  esbuild: ^0.28.1
  effect: 4.0.5
  fast-check: ^4.8.0
  electron: ^43.4.1
  electron-builder: ^26.15.3
  electron-vite: ^5.0.0
  framer-motion: ^12.23.24
  ghostty-web: ^0.4.0
  jsdom: ^28.1.0
  lucide-react: ^0.545.0
  pg: ^8.22.0
  pg-boss: ^12.25.1
  qrcode: ^1.5.4
  react: 19.2.3
  react-dom: 19.2.3
  tailwindcss: ^4.1.18
  tsx: ^4.23.12
  typescript: ^7.0.2
  undici: ^7.28.0
  vite: ^7.3.1
  vite-tsconfig-paths: ^5.1.4
  # @effect/vitest 4 asks for Vitest 5; exact, the one vite-plus 1.0.0 (t3code) pins.
  vitest: 5.0.1
  wrangler: ^4.78.0
  zod: ^4.1.12

# t3code's own dependencies, for the t3code gateway and its vendored contracts only (ADR 0012).
# Versions are t3code's pins at the tag in packages/t3-contracts/t3code.pin.json. Effect and
# Vitest come from the default catalog, which matches t3code's pins.
catalogs:
  t3:
    "@types/mdast": 4.0.4
    mdast-util-directive: 3.1.0
    micromark-extension-directive: 4.0.0
    micromark-util-character: 2.1.1
    micromark-util-types: 2.0.2
    rehype-raw: 7.0.0
    rehype-sanitize: 6.0.0
    remark-breaks: 4.0.0
    remark-gfm: 4.0.1
    remark-parse: 11.0.0
    remark-rehype: 11.1.2
    unified: 11.0.5
  # TanStack Start 1.0 (@tanstack/react-start 1.169) requires Vite 8, so apps/web and apps/marketing
  # build with it. apps/desktop keeps the default catalog's Vite 7: electron-vite 5 supports up to 7.
  start:
    vite: ^8.3.4
  # TypeScript 7 has no JavaScript compiler API. Packages whose tools load `typescript` as a library
  # (astro check in docs, Expo's config loader in mobile) take TypeScript 6 under that name. Its only
  # bin is tsc6, so their `tsc` is still the root's TypeScript 7.
  ts6:
    typescript: npm:@typescript/typescript6@^6.0.2

# @effect/platform-node 4.0.5 asks for @effect/platform-node-shared ^4.0.5, which would resolve to
# the newest 4.0.x and its own effect peer. Pin it with the rest of the Effect family (t3code does too).
overrides:
  # Werift's x509 v1 must share its ASN.1 schema registry with the 2.11 model packages.
  "@peculiar/x509@1>@peculiar/asn1-schema": 2.11.1
  "@effect/platform-node@4.0.5>@effect/platform-node-shared": 4.0.5

# These declare a typescript peer but never load it: bun-ffi-structs has no runtime use, and tsconfck
# loads it only for parseNative, which vite-tsconfig-paths leaves off.
peerDependencyRules:
  allowedVersions:
    bun-ffi-structs>typescript: "7"
    tsconfck>typescript: "7"

# SLNT-385: Drizzle's query error held a failed query's parameters, what a person wrote. The db
# package's query-error tests guard the patch and fail on any unpatched copy.
patchedDependencies:
  drizzle-orm@1.0.0-rc.5-5935859: patches/drizzle-orm@1.0.0-rc.5-5935859.patch

onlyBuiltDependencies:
  - electron
  - esbuild
  - workerd

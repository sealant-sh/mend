# t3code's Effect, for the t3code gateway and its vendored contracts only (ADR 0012). The rest of
# the monorepo stays on the default catalog. Versions are t3code's pins at the tag in
# packages/t3-contracts/t3code.pin.json; vitest is the one vite-plus 1.0.0 pins. A package that
# takes @effect/vitest from the default catalog must also declare effect, or pnpm satisfies the peer
# with the t3 catalog's (beta.93 is below @effect/vitest's ^4.0.0-beta.98); hence effect in apps/cli.
catalogs:
  t3:
    "@effect/platform-node": 4.0.5
    "@effect/vitest": 4.0.5
    effect: 4.0.5
    vitest: 5.0.1
    vitest-v5: npm:vitest@5.0.1
    mdast-util-directive: 3.1.0
    micromark-extension-directive: 4.0.0
    micromark-util-character: 2.1.1
    micromark-util-types: 2.0.2
    rehype-raw: 7.0.0
    rehype-sanitize: 6.0.0
    remark-breaks: 4.0.0
    remark-gfm: 4.0.1
    remark-parse: 11.0.0
    remark-rehype: 11.1.2
    unified: 11.0.5
  # TanStack Start 1.0 (@tanstack/react-start 1.169) requires Vite 8, so apps/web and apps/marketing
  # build with it. apps/desktop keeps the default catalog's Vite 7: electron-vite 5 supports up to 7.
  start:
    vite: ^8.3.4

# @effect/platform-node 4.0.5 asks for @effect/platform-node-shared ^4.0.5, which would resolve to
# the newest 4.0.x and its own effect peer. t3code pins it to 4.0.5 in its catalog; so does this.
overrides:
  "@effect/platform-node@4.0.5>@effect/platform-node-shared": 4.0.5

onlyBuiltDependencies:
  - electron
  - esbuild
  - workerd

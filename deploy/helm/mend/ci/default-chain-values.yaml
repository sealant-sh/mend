# Rendering fixture only: infrastructure supplies the bucket, IRSA service account and private LB.
store:
  create:
    enabled: true
captureStore:
  blobStore:
    url: s3://mend-captures?region=eu-west-1
    publicUrl: https://mend-captures.s3.eu-west-1.amazonaws.com
    useDefaultCredentials: true
api:
  serviceAccountName: mend-capture-writer
sessionChannel:
  advertisedUrl: https://mend-session.internal:3106
  service:
    type: NodePort
    nodePort: 30106
  tls:
    enabled: true
    secretName: mend-session-tls
networkPolicies:
  sessionChannelCidrs: [10.42.16.0/20]

# The CI fixtures render an in-cluster channel over plain http, which the Sealant 0.34 daemon dials
# only on this statement (the cluster network is one the operator controls).
exposure:
  executorNetwork: private

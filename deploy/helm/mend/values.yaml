# Mend on Kubernetes (docs/KUBERNETES.md). Cluster-internal by default: no Ingress.

image:
  repository: ghcr.io/sealant-sh/mend
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# Referenced, never rendered. Keys: DATABASE_URL (when postgres.enabled=false),
# BETTER_AUTH_SECRET, SEALANT_SERVICE_KEY, MEND_DB_PASSWORD (when postgres.enabled=true).
secrets:
  existingSecret: mend-secrets

# The API Pod's store directory: bare repositories, the runner cache
# (`_cache/runner/<project>/repo.git`), references and the machine git key. Only the API Pod
# mounts it — since decision 8 (docs/KUBERNETES.md "The store") sessions live in the capture store
# below and workspace Pods mount nothing from Mend — so a ReadWriteOnce claim on the cluster's
# default class is enough. Nothing here is mirrored into the workspace namespace.
store:
  # Choose ONE explicitly; the chart refuses to render with neither. A fresh install sets
  # `create.enabled: true`. An UPGRADE from chart 0.1.x sets `existingClaim: mend-store`: the old
  # claim holds the bare repositories, the machine key and every legacy worktree, which is
  # backfilled into the capture store at its first launch by reading the mounted claim — a new
  # empty claim would silently lose that (docs/KUBERNETES.md "Upgrade"). RWX claims mount fine.
  existingClaim: ""
  create:
    enabled: false
    storageClassName: "" # empty = the cluster default (e.g. ceph-block)
    size: 50Gi
  mountPath: /var/lib/mend/store

# The capture store (docs/adr/0002-session-capture-store.md): a bucket holds immutable captures,
# Postgres the pointers. Every session's work ships to the bucket; presigned URLs name it, so
# workspace Pods must resolve and reach the endpoint (the Sealant chart's workspace
# NetworkPolicy — see NOTES.txt). Point the chart at the bucket ONE of two ways.
captureStore:
  # `captured` is the only value this chart renders. The deprecated co-located store
  # (`MEND_SESSION_STORE=colocated`, the shared RWX claim mirrored into workspace Pods) is not
  # supported by this chart version; an install that has not moved stays on chart 0.1.x.
  sessionStore: captured
  blobStore:
    # (a) A Rook ObjectBucketClaim in the RELEASE namespace: the OBC yields a ConfigMap
    # (BUCKET_HOST, BUCKET_PORT, BUCKET_NAME) and a Secret (AWS_ACCESS_KEY_ID,
    # AWS_SECRET_ACCESS_KEY), both named after the claim. The chart reads all five through
    # `valueFrom` and builds MEND_BLOB_STORE as
    # `s3://$(BUCKET_NAME)?endpoint=<scheme>://$(BUCKET_HOST):$(BUCKET_PORT)&region=<region>&forcePathStyle=true`.
    fromObjectBucketClaim:
      configMap: "" # e.g. mend-bucket (the OBC's name)
      secret: "" # e.g. mend-bucket (the OBC's name)
      scheme: http # the RGW gateway's scheme (CephObjectStore .spec.gateway.port vs securePort)
      region: us-east-1 # any name; RGW accepts every region, Garage wants its `s3_region`
    # (b) The bucket URL itself — Garage, an RGW bucket you made by hand, any S3-compatible
    # endpoint: `s3://<bucket>?endpoint=<url>&region=<name>&forcePathStyle=<bool>`
    # (packages/store/src/blob-store.ts). Leave `endpoint=` unencoded as below.
    url: "" # e.g. s3://mend?endpoint=http://rook-ceph-rgw-mend.rook-ceph.svc:80&region=us-east-1&forcePathStyle=true
    # Keys AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY; required with `url`, ignored with the OBC.
    credentialsSecret: ""
    # The endpoint workspace Pods resolve; presigned URLs carry it (MEND_BLOB_STORE_PUBLIC_URL).
    # Empty = the same in-cluster endpoint the API uses (the OBC's host:port, or `endpoint=`
    # from `url`), which is right whenever workspace Pods share the cluster DNS.
    publicUrl: ""
    # Where the endpoint's Pods live, for the API tier's egress rule (networkpolicies.yaml).
    # Empty namespace = the release namespace (Garage deployed beside Mend). An empty selector
    # allows the whole namespace on the pod port; narrow it to the RGW Pods of a CephObjectStore
    # named `mend` with { app: rook-ceph-rgw, rook_object_store: mend } (Helm merges maps, so
    # the default is empty rather than a Rook-shaped one you would have to null out).
    # Two ports: `port` is the Service port the URL names (BUCKET_PORT, or `endpoint=` in
    # `url`; informational here, nothing renders it); `podPort` is what the RGW CONTAINER
    # listens on — a NetworkPolicy matches the pod port after the Service's DNAT, and Rook's
    # gateway Service maps 80 → 8080 (rgwPortInternalPort). Garage listens on 3900 for both.
    endpoint:
      namespace: rook-ceph
      port: 80
      podPort: 8080
      podSelector: {}
  # Packs at or above the threshold go up as multipart uploads; S3 and R2 refuse parts under
  # 5 MiB. Empty = the defaults (16 MiB / 16 MiB). Plain integers, bytes.
  multipart:
    thresholdBytes: ""
    partSizeBytes: ""

postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 20Gi
  storageClassName: ""

sealant:
  # The Sealant API inside the cluster (the sealant chart's API Service).
  baseUrl: http://sealant-api.sealant.svc:4000

# The API tier (apps/api): contract + auth + data planes + session engine + workers in one
# process (MEND_MODE=all). The engine holds live in-memory state, so keep replicaCount at 1
# until it grows leases/leader election (docs/KUBERNETES.md).
api:
  # The slim per-tier image (apps/api/Dockerfile). Unset repository/tag fall
  # back to the shared `image` block. When substituting the combined image,
  # set the tier's entrypoint too: command: [node, apps/api/src/main.ts]
  image:
    repository: ghcr.io/sealant-sh/mend-api
    tag: ""
  command: []
  replicaCount: 1
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "4", memory: 4Gi } }
  # Source addresses the API treats as proxy hops when reading x-forwarded-for
  # (device pairing's rate limiter). Set to the pod CIDR the web tier lives in;
  # 10.244.0.0/16 is the flannel default. Empty list = trust loopback only.
  trustedProxyCidrs: ["10.244.0.0/16"]

# The web tier (apps/web): the TanStack app + a transparent /api proxy to the API tier.
# Stateless — scale it freely.
web:
  # The slim per-tier image (apps/web/Dockerfile): .output only, no source.
  # Combined-image substitution needs: command: [node, apps/web/src/entry/main.ts]
  image:
    repository: ghcr.io/sealant-sh/mend-web
    tag: ""
  command: []
  replicaCount: 1
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
  service:
    type: ClusterIP
    annotations: {}
  appUrl: http://localhost:3105

# Supervised Service listeners (`mend service run/add`) — the same operator policy as
# everywhere else (MEND_SERVICE_HOSTS, MEND_SERVICE_PORT_MIN/MAX). Defaults match local mode:
# loopback only, nothing exposed — Services then answer only inside the Pod. To reach them from
# client networks, bind 0.0.0.0, keep the range small (each port is one entry on the exposure
# Service), and enable `expose`. Connections on these ports carry no Mend auth; reachability is
# your gate — networkPolicies.clientCidrs applies to the range when expose is enabled.
serviceHost:
  # Entries are literal private IPs, plus the sentinel "podIP" — the Pod's own address via the
  # downward API (wildcards are refused by the bind policy; the Pod IP is what the exposure
  # Service targets anyway).
  bindAddresses: [] # e.g. ["podIP"]; empty keeps the loopback default
  portMin: 43100
  portMax: 43999
  expose:
    enabled: false
    service:
      type: LoadBalancer
      annotations: {}

# The network session channel workspaces use instead of the per-session socket.
sessionChannel:
  port: 3106
  tls:
    enabled: false
    secretName: "" # kubernetes.io/tls secret with tls.crt/tls.key

networkPolicies:
  enabled: true
  # Client networks allowed to reach the UI/API (3105) through your exposure. Empty = in-cluster.
  # With `externalTrafficPolicy: Cluster` a cross-node hop SNATs the source to the cluster's POD
  # CIDR — include it, or use externalTrafficPolicy: Local for real client addresses.
  clientCidrs: []
  # Where Sealant workspace Pods live (they are the only clients of the session channel; they
  # also reach the bucket directly, which the SEALANT chart's workspace policy governs).
  workspaceNamespace: sealant
  # Where the Sealant API lives (the worker and web call it).
  sealantNamespace: sealant

# Extra env for both tiers (plain values only).
extraEnv: []

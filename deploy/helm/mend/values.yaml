# Mend on Kubernetes (docs/KUBERNETES.md). Cluster-internal by default: no Ingress.

image:
  repository: ghcr.io/sealant-sh/mend
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# Referenced, never rendered. Keys: DATABASE_URL (when postgres.enabled=false),
# BETTER_AUTH_SECRET, SEALANT_SERVICE_KEY, MEND_DB_PASSWORD (when postgres.enabled=true).
secrets:
  existingSecret: mend-secrets

# The API Pod's store directory: bare repositories, the runner cache, references, the machine key.
# Since decision 8 (docs/KUBERNETES.md "The store") the session store is the capture store (a
# bucket + Postgres) and workspace Pods mount nothing from here, so RWO is enough; the RWX wording
# below is the deprecated co-located store's and narrowing it is a follow-up.
store:
  existingClaim: mend-store
  # Set to create the claim here instead (storageClassName must be an RWX class on your cluster).
  create:
    enabled: false
    storageClassName: ""
    size: 100Gi
  mountPath: /var/lib/mend/store

postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 20Gi
  storageClassName: ""

sealant:
  # The Sealant API inside the cluster (the sealant chart's API Service).
  baseUrl: http://sealant-api.sealant.svc:4000

# The API tier (apps/api): contract + auth + data planes + session engine + workers in one
# process (MEND_MODE=all). The engine holds live in-memory state, so keep replicaCount at 1
# until it grows leases/leader election (docs/KUBERNETES.md).
api:
  # The slim per-tier image (apps/api/Dockerfile). Unset repository/tag fall
  # back to the shared `image` block. When substituting the combined image,
  # set the tier's entrypoint too: command: [node, apps/api/src/main.ts]
  image:
    repository: ghcr.io/sealant-sh/mend-api
    tag: ""
  command: []
  replicaCount: 1
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "4", memory: 4Gi } }
  # Source addresses the API treats as proxy hops when reading x-forwarded-for
  # (device pairing's rate limiter). Set to the pod CIDR the web tier lives in;
  # 10.244.0.0/16 is the flannel default. Empty list = trust loopback only.
  trustedProxyCidrs: ["10.244.0.0/16"]

# The web tier (apps/web): the TanStack app + a transparent /api proxy to the API tier.
# Stateless — scale it freely.
web:
  # The slim per-tier image (apps/web/Dockerfile): .output only, no source.
  # Combined-image substitution needs: command: [node, apps/web/src/entry/main.ts]
  image:
    repository: ghcr.io/sealant-sh/mend-web
    tag: ""
  command: []
  replicaCount: 1
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
  service:
    type: ClusterIP
    annotations: {}
  appUrl: http://localhost:3105

# Supervised Service listeners (`mend service run/add`) — the same operator policy as
# everywhere else (MEND_SERVICE_HOSTS, MEND_SERVICE_PORT_MIN/MAX). Defaults match local mode:
# loopback only, nothing exposed — Services then answer only inside the Pod. To reach them from
# client networks, bind 0.0.0.0, keep the range small (each port is one entry on the exposure
# Service), and enable `expose`. Connections on these ports carry no Mend auth; reachability is
# your gate — networkPolicies.clientCidrs applies to the range when expose is enabled.
serviceHost:
  # Entries are literal private IPs, plus the sentinel "podIP" — the Pod's own address via the
  # downward API (wildcards are refused by the bind policy; the Pod IP is what the exposure
  # Service targets anyway).
  bindAddresses: [] # e.g. ["podIP"]; empty keeps the loopback default
  portMin: 43100
  portMax: 43999
  expose:
    enabled: false
    service:
      type: LoadBalancer
      annotations: {}

# The network session channel workspaces use instead of the per-session socket.
sessionChannel:
  port: 3106
  tls:
    enabled: false
    secretName: "" # kubernetes.io/tls secret with tls.crt/tls.key

networkPolicies:
  enabled: true
  # Client networks allowed to reach the UI/API (3105) through your exposure. Empty = in-cluster.
  # With `externalTrafficPolicy: Cluster` a cross-node hop SNATs the source to the cluster's POD
  # CIDR — include it, or use externalTrafficPolicy: Local for real client addresses.
  clientCidrs: []
  # Where Sealant workspace Pods live (they are the only clients of the session channel).
  workspaceNamespace: sealant
  # Where the Sealant API lives (the worker and web call it).
  sealantNamespace: sealant

# Extra env for both tiers (plain values only).
extraEnv: []

{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled" .Values.ingress.host }}
{{- $secret := required "ingress.tls.secretName is required when ingress.enabled: Mend is never routed without TLS" .Values.ingress.tls.secretName }}
{{- if ne .Values.web.appUrl (printf "https://%s" $host) }}
{{ fail (printf "ingress: web.appUrl must be exactly https://%s (got %q): the browser origin and the routed host are one thing" $host .Values.web.appUrl) }}
{{- end }}
{{- if and .Values.networkPolicies.enabled (or (not .Values.ingress.controller.namespace) (not .Values.ingress.controller.podLabels)) }}
{{ fail "ingress: set ingress.controller.namespace and ingress.controller.podLabels so NetworkPolicy admits the controller's Pods to web, and only them" }}
{{- end }}
# One host, TLS, and the web Service only. Web proxies /api, the event stream and every WebSocket
# on this origin; the API, Sealant and the session channel are never routed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  labels: {{ include "mend.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ $secret | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port: { number: 3105 }
{{- end }}
{{- if .Values.preview.enabled }}
{{- $domain := .Values.preview.domain }}
---
# A networking/v1 wildcard host matches exactly one label, as the gateway does.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-preview
  labels: {{ include "mend.labels" . | nindent 4 }}
  {{- with .Values.preview.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with (.Values.preview.ingress.className | default .Values.ingress.className) }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts: [{{ printf "*.%s" $domain | quote }}]
      secretName: {{ .Values.preview.ingress.tls.secretName | quote }}
  rules:
    - host: {{ printf "*.%s" $domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-preview
                port: { number: {{ .Values.preview.port }} }
{{- end }}

{{- if .Values.networkPolicies.enabled }}
# Web tier: client networks reach 3105; egress to DNS and the API tier only would be ideal,
# but SSR also fetches nothing external today — keep egress open for parity with the API tier.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-web
  labels: {{ include "mend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "mend.component" (dict "root" . "name" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} } }
    {{- with .Values.networkPolicies.clientCidrs }}
    - from:
        {{- range . }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports: [{ protocol: TCP, port: 3105 }]
    {{- end }}
  egress:
    - {}
---
# API tier: the web tier reaches 3101; Sealant workspace Pods reach the session channel (and its
# capture routes); client networks may also reach 3101 directly (CLI pointed at the API instead
# of the web proxy). Egress: the bucket endpoint by name, plus the catch-all — DNS, Postgres, the
# Sealant API, and the internet (git remotes, inference).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels: {{ include "mend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "mend.component" (dict "root" . "name" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} } }
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicies.workspaceNamespace }} } }
          podSelector: { matchLabels: { app.kubernetes.io/managed-by: sealant, app.kubernetes.io/component: workspace } }
      ports: [{ protocol: TCP, port: {{ .Values.sessionChannel.port }} }]
    {{- with .Values.networkPolicies.sessionChannelCidrs }}
    - from:
        {{- range . }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports: [{ protocol: TCP, port: {{ $.Values.sessionChannel.port }} }]
    {{- end }}
    {{- with .Values.networkPolicies.clientCidrs }}
    - from:
        {{- range . }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports: [{ protocol: TCP, port: 3101 }]
    {{- end }}
    {{- if and .Values.serviceHost.expose.enabled .Values.networkPolicies.clientCidrs }}
    - from:
        {{- range .Values.networkPolicies.clientCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.serviceHost.portMin }}, endPort: {{ .Values.serviceHost.portMax }} }
    {{- end }}
  egress:
    # The capture store's bucket endpoint (RGW in rook-ceph, or Garage beside Mend), named
    # explicitly so the API keeps writing captures when the catch-all below is narrowed by an
    # operator policy. A NetworkPolicy matches the POD port (after the Service's DNAT): Rook's
    # RGW container listens on 8080 behind a Service on 80. Workspace Pods reach the same
    # endpoint under the SEALANT chart's workspace policy (NOTES.txt).
    {{- $endpoint := .Values.captureStore.blobStore.endpoint }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $endpoint.namespace | default .Release.Namespace }} } }
          {{- with $endpoint.podSelector }}
          podSelector:
            matchLabels: {{ toYaml . | nindent 14 }}
          {{- end }}
      ports: [{ protocol: TCP, port: {{ $endpoint.podPort }} }]
    - {}
---
# Postgres accepts only the API tier.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{ include "mend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "mend.component" (dict "root" . "name" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{ include "mend.component" (dict "root" . "name" "api") | nindent 14 }}
      ports: [{ protocol: TCP, port: 5432 }]
{{- end }}

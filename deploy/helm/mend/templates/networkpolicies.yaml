{{- if .Values.networkPolicies.enabled }}
# Mend Pods: ingress from the same namespace (UI/API through whatever the operator exposes) and,
# for the session channel port, from Sealant workspace Pods only. Egress: DNS, Postgres, the
# Sealant API, and the internet (git remotes, inference).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-mend
  labels: {{ include "mend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mend, app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} } }
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicies.workspaceNamespace }} } }
          podSelector: { matchLabels: { app.kubernetes.io/managed-by: sealant, app.kubernetes.io/component: workspace } }
      ports: [{ protocol: TCP, port: {{ .Values.sessionChannel.port }} }]
  egress:
    - {}
{{- end }}

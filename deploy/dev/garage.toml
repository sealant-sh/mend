# Garage in single-node mode for the Mend dev stack (compose.dev.yaml): the S3-compatible
# bucket the capture store writes under MEND_SESSION_STORE=captured (ADR-0002 "Placement per
# tier", decision 15). One node, replication factor 1, no TLS — a dev stack, never a deployment.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# Fixed so the node id is stable across restarts; the value is not a secret in a dev stack.
rpc_secret = "1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "mend-dev-garage-admin"

# Regenerates ../store and ../heads.json from sealant-capture itself (sealantd PR #99, dir packs),
# against a sealantd checkout beside this Mend checkout:
#   nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc -c cargo run -- ../
# Not part of the Mend build; captures.test.ts reads what it wrote.
[package]
name = "fixture-gen"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sealant-capture = { path = "../../../../../../../Sealantd/crates/sealant-capture" }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"

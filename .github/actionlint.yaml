# Configuration for `actionlint` (no workflow runs it; run it by hand on workflow changes).
# GitHub supports `concurrency.queue` since 2026-05-07; actionlint 1.7.12 does not know it yet
# (rhysd/actionlint#657). Drop these once it does.
paths:
  .github/workflows/release-cli.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/ghcr-staging-cleanup.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'

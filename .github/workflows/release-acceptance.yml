# Packaged acceptance before a tag exists. release-cli.yml runs the same acceptance when a
# vVERSION tag is pushed, which is too late to learn a release is broken: the version is spent.
# version.yml dispatches this on the Version Packages branch, because a pull request opened with
# GITHUB_TOKEN never triggers pull_request workflows. Any other same-repository pull request runs
# it by carrying the release-e2e label.
name: Release acceptance

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Build candidates and run packaged acceptance
    # Image builds push candidate tags, so a fork's pull request can never run this.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name ==
      github.repository && contains(github.event.pull_request.labels.*.name, 'release-e2e'))
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

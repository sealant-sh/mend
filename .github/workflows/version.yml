# Versioning only: consume pending changesets on main and open/update the Version Packages PR.
# Publishing remains tag-triggered and environment-gated in release-cli.yml.
name: Version

on:
  push:
    branches:
      - main
  # A second chance for approve-checks: GitHub can create the held run long after the push.
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Grouped by event too, so an hourly run never waits behind, or cancels, a push's pending run.
concurrency:
  group: version-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Open version PR
    if: github.repository == 'sealant-sh/Mend' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-request: ${{ steps.changesets.outputs.pullRequestNumber }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # No pnpm store cache: jobs running unowned code write it, and this job can push.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      # Bound to the committed lockfile, like every other install (docs/adr/0015-next-channel.md).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub holds the Version Packages PR's pull_request runs at `action_required` because
  # github-actions[bot] pushed its branch, so the required `checks` never reports on it. Runs
  # dispatched on the branch do not count either: the PR shows only its held runs. Approving the
  # held run starts it as an ordinary pull_request run, which the PR counts. Only the run the version
  # job's push created is approved: CI, the one workflow that reports `checks`, on the PR's head
  # commit, triggered by github-actions[bot]. A job of its own, so the token that can push
  # cannot approve. Packaged acceptance is not a required check; the release still dispatches it
  # (docs/operations/next-channel.md, step 8).
  #
  # GitHub usually creates the held run seconds after the push, but when Actions is slow it can
  # take longer than the push's run waits (seven minutes on 16 Nov 2026). The push's run then
  # warns and leaves it to the hourly run, which finds the open Version Packages PR and approves
  # its held run the same way. The hourly run fails only when the PR's head is over an hour old
  # and still has no CI run, so a run GitHub never creates stays loud.
  approve-checks:
    name: Start the Version Packages PR's checks
    needs: version
    if: >-
      !cancelled() && github.repository == 'sealant-sh/Mend' && (github.event_name != 'push' ||
      needs.version.outputs.pull-request != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Approve its held CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # Empty on an hourly or dispatched run: the step looks the open PR up.
          PR: ${{ needs.version.outputs.pull-request }}
          # After a push, look for five minutes; an hourly run looks once.
          TRIES: ${{ github.event_name == 'push' && '30' || '1' }}
          POLL_SECONDS: "10"
          STALE_SECONDS: "3600"
        run: |
          set -euo pipefail
          branch=changeset-release/main
          if [ -z "$PR" ]; then
            PR=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -z "$PR" ]; then
              echo "No Version Packages PR is open"
              exit 0
            fi
          fi
          pr=$(gh pr view "$PR" --json headRefName,headRefOid,commits \
            --jq "select(.headRefName == \"$branch\") | [.headRefOid, .commits[-1].committedDate] | @tsv")
          if [ -z "$pr" ]; then
            echo "::error::#$PR is not the Version Packages PR (head branch is not $branch)"
            exit 1
          fi
          IFS=$'\t' read -r head committed <<<"$pr"
          pending="ci.yml"
          for try in $(seq "$TRIES"); do
            runs=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$head&event=pull_request&per_page=50" \
              --jq ".workflow_runs[] | select(.head_branch == \"$branch\")
                | [.path, .id, .conclusion // \"none\", .actor.login] | @tsv")
            left=""
            for workflow in $pending; do
              # Newest first: the run the latest push created.
              run=$(printf '%s\n' "$runs" | awk -F '\t' -v path=".github/workflows/$workflow" \
                '$1 == path { print; exit }')
              if [ -z "$run" ]; then
                left="$left $workflow"
                continue
              fi
              IFS=$'\t' read -r _ id conclusion actor <<<"$run"
              if [ "$conclusion" != action_required ]; then
                echo "$workflow run $id on $head is already started"
              elif [ "$actor" != "github-actions[bot]" ]; then
                echo "::error::$workflow run $id on $head waits for approval but $actor triggered it"
                exit 1
              else
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null
                echo "Approved $workflow run $id on $head"
              fi
            done
            pending=$left
            [ -z "$pending" ] && exit 0
            [ "$try" -lt "$TRIES" ] && sleep "$POLL_SECONDS"
          done
          if [ "$EVENT" = push ]; then
            echo "::warning::No pull_request run of$pending appeared on $head yet; Version's hourly run approves it once GitHub creates it"
            exit 0
          fi
          age=$(( $(date +%s) - $(date -d "$committed" +%s) ))
          if [ "$age" -lt "$STALE_SECONDS" ]; then
            echo "No pull_request run of$pending on $head yet, $((age / 60)) minutes after its commit; the next hourly run looks again"
            exit 0
          fi
          echo "::error::No pull_request run of$pending appeared on $head in $((age / 60)) minutes"
          exit 1

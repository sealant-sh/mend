# Versioning only: consume pending changesets on main and open/update the Version Packages PR.
# Publishing remains tag-triggered and environment-gated in release-cli.yml.
name: Version

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Open version PR
    if: github.repository == 'sealant-sh/Mend'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # No pnpm store cache: jobs running unowned code write it, and this job can push.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      # Bound to the committed lockfile, like every other install (docs/adr/0015-next-channel.md).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Version PR is opened with GITHUB_TOKEN, so no pull_request workflow runs on it. A
      # dispatch is exempt from that rule, and its checks attach to the branch's head commit.
      - name: Run packaged acceptance on the Version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: gh workflow run release-acceptance.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

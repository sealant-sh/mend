name: Deploy on the box

# Deploys a next build or a preview that is already built (ghcr.io/sealant-sh/mend:<version>) on the
# Mend VM: a hosted runner asks the VM's `deploy` user over SSH (port 2223 on the box), whose forced
# command runs the deploy script and nothing else. `preview.yml` deploys on its own when dispatched
# with `deploy: true`; this is for deploying a version again, or one built earlier.

on:
  workflow_dispatch:
    inputs:
      version:
        description:
          "The version to deploy: a next build (0.36.0-next.N) or a preview
          (0.36.0-next.N.preview.R)"
        required: true
        type: string
      commit:
        description: "The full mend commit sha that version was built from"
        required: true
        type: string
      even_if_live:
        description:
          "Deploy even while sessions are live on the box (they lose their executor's connection)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'sealant-sh/mend'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check the commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be the full 40-character sha"; exit 1; }
      - name: Deploy the preview on the box
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          EVEN_IF_LIVE: ${{ inputs.even_if_live && 'even-if-live' || '' }}
          DEPLOY_KEY: ${{ secrets.MEND_BOX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [[ -n $DEPLOY_KEY ]] || { echo "::error::MEND_BOX_DEPLOY_KEY is not set"; exit 1; }
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > deploy_key
          # The VM's sshd host key, pinned: a changed key fails the deploy rather than asking.
          printf '%s\n' "[49.12.133.97]:2223 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH+2Sqq9ar1sq1Yz2aoyHcJfHT7vHHQ30bEbNh7zqgl/" > known_hosts
          # The `deploy` user's forced command accepts exactly this and nothing else.
          ssh -p 2223 -i deploy_key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=20 deploy@49.12.133.97 \
            deploy "$VERSION" "$COMMIT" $EVEN_IF_LIVE

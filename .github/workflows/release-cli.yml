# A vVERSION tag releases the complete Mend product. Historical cli-v tags do not
# have the versioned server assets required by the new installer.
# npm Trusted Publishing uses sealant-sh/Mend, release-cli.yml, environment release.
#
# Two kinds of tag (docs/adr/0015-next-channel.md):
# - vX.Y.Z-next.N, a `next` build: a GitHub prerelease and npm's `next` dist-tag. `latest` stays.
# - vX.Y.Z, a stable release: a promotion of a next build, with no prerelease pinned anywhere.
# The pins job refuses anything else before an image is built.
name: Release Mend

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  pins:
    name: Check what the release pins
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      # Full history and every tag: N counts the whole history, B reads the next tags handed out,
      # and a stable release is compared with the next build it promotes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: node scripts/check-release-pins.mjs "$GITHUB_REF_NAME"

  images:
    name: Build and verify server images
    needs: pins
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # Builds and packs the CLI. No id-token here: nothing this job runs, the dependencies' build tools
  # included, can reach the npm credential.
  npm-pack:
    name: Pack @sealant/mend
    needs: pins
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # No pnpm store cache: other jobs, running unowned code, write that cache.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The git tag is the single version authority: overwrite the package version from it so the
      # published version always matches the release. The commit goes in as gitHead, which the
      # publish job checks and the release guards read.
      - name: Set the version and commit from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#cli-}"
          VERSION="${VERSION#v}"
          cd apps/cli
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pkg set "gitHead=$GITHUB_SHA"

      - name: Build and pack
        run: |
          set -euo pipefail
          pnpm --filter "@sealant/mend" run build
          mkdir -p "$RUNNER_TEMP/tarballs"
          (cd apps/cli && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          ls -l "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mend-tarball
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Holds the npm credential and runs nothing from the repository: no checkout, no install. The
  # artifact must be exactly the expected tarball; npm runs from an empty directory; the tarball is
  # rebuilt from npm's own reading of it (npm's bundled pacote), with an allowlisted manifest, and
  # that is what publishes. @sealant/mend's `next` stays on this approval-gated path
  # (docs/adr/0015-next-channel.md): people install `@sealant/mend@next`.
  npm:
    name: Publish @sealant/mend
    needs: [images, github-release, npm-pack]
    # Github-hosted runner on purpose: the OIDC id-token should be minted on
    # infrastructure GitHub controls.
    # npm trusted publishing (OIDC) needs a GitHub-hosted runner: this job stays off Blacksmith.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      # Node 24 bundles npm >= 11.5, which trusted publishing needs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mend-tarball
          path: tarballs

      # Under next, checked here, after the approval: two next tags approved in the wrong order
      # must not move `next` back. The pins job only saw the tags as they were when the run started.
      - name: Publish to npm
        run: |
          set -euo pipefail
          # --- republish ---
          # republish.test.mjs runs this block as written, against a stub registry. The callers check the
          # downloaded artifact directory first (check_artifacts), then run every npm command from a fresh
          # empty directory, so no .npmrc in or near the artifact can configure npm. The tarball pack built is
          # never published as it is: npm's own copy of pacote (no install, nothing unpinned loads) extracts
          # it, package.json is rewritten from an allowlist (no `tag`, no scripts, no publishConfig but
          # `access`), a root binding.gyp is refused (npm would add an install script for it), the rewritten
          # manifest is checked, and `npm pack` builds the tarball that is published.
          # Failures inside $(...) stop the job too.
          shopt -s inherit_errexit
          KEEP_FIELDS='["name","version","description","license","repository","homepage","bugs","keywords","type","main","module","types","typings","exports","files","bin","man","directories","engines","dependencies","peerDependencies","peerDependenciesMeta","optionalDependencies","gitHead"]'

          # The artifact directory <dir> holds exactly the expected tarballs (regular files), nothing else.
          check_artifacts() {
            local dir=$1 extra expected
            shift
            extra=$(cd "$dir" && find . -mindepth 1 | sed 's|^\./||' | grep -vxF -f <(printf '%s\n' "$@") || true)
            if [[ -n $extra ]]; then
              echo "::error::The artifact holds more than the expected tarballs: $(tr '\n' ' ' <<<"$extra")"
              return 1
            fi
            for expected in "$@"; do
              if [[ ! -f $dir/$expected || -L $dir/$expected ]]; then
                echo "::error::$expected is missing from the artifact, or is not a regular file."
                return 1
              fi
            done
          }

          # GET <path> from the registry, retried; a failure or a 404 stops the job: never guessed.
          registry_get() {
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [where, registry] = process.argv.slice(1);
              const url = new URL(where, registry.endsWith("/") ? registry : `${registry}/`);
              const run = async () => {
                for (let attempt = 1; attempt <= 4; attempt += 1) {
                  try {
                    const response = await fetch(url, { headers: { accept: "application/json" } });
                    if (response.ok) return process.stdout.write(JSON.stringify(await response.json()));
                    if (attempt === 4) throw new Error(`the registry answered ${response.status} for ${where}`);
                  } catch (error) {
                    if (attempt === 4) {
                      console.error(`::error::${error.message}`);
                      process.exit(1);
                    }
                  }
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1500));
                }
              };
              run();
            ' -- "$1" "$(npm config get registry)"
          }

          # A dist-tag's version, or nothing, from the uncached dist-tags endpoint.
          dist_tag() {
            local tags
            tags=$(registry_get "-/package/${1/\//%2f}/dist-tags")
            node -e 'process.stdout.write(String(JSON.parse(process.argv[1])[process.argv[2]] ?? ""))' "$tags" "$2"
          }

          # The commit a published version came from ("unknown" without gitHead), or nothing if unpublished.
          published_from() {
            local record
            record=$(registry_get "${1/\//%2f}")
            node -e '
              const found = JSON.parse(process.argv[1]).versions?.[process.argv[2]];
              process.stdout.write(found === undefined ? "" : String(found.gitHead ?? "unknown"));
            ' "$record" "$2"
          }

          # Whether $1 is a newer next version than $2 (X.Y.Z-next.N; a stable X.Y.Z sorts after them).
          newer() {
            node -e '
              const order = (v) => {
                const [core, n] = v.split("-next.");
                return [...core.split(".").map(Number), n === undefined ? Infinity : Number(n)];
              };
              const [a, b] = [order(process.argv[1]), order(process.argv[2])];
              if ([...a, ...b].some(Number.isNaN)) process.exit(2);
              const i = a.findIndex((x, k) => x !== b[k]);
              process.exit(i >= 0 && a[i] > b[i] ? 0 : 1);
            ' "$1" "$2"
          }

          # Extracts <tarball> with pacote, rewrites and checks its manifest, repacks it; prints the new path.
          rebuild_tarball() {
            local tarball=$1 name=$2 version=$3 commit=$4 channel=$5 work packed pacote
            pacote=${REPUBLISH_TEST_PACOTE:-$(npm root -g)/npm/node_modules/pacote}
            work=$(mktemp -d)
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const [pacotePath, tarball, dir, name, version, commit, channel, keepText] = process.argv.slice(1);
              const pacote = require(pacotePath);
              const run = async () => {
                await pacote.extract(`file:${path.resolve(tarball)}`, dir);
                const read = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
                const manifest = {};
                for (const field of JSON.parse(keepText)) if (field in read) manifest[field] = read[field];
                if (read.publishConfig?.access !== undefined) manifest.publishConfig = { access: read.publishConfig.access };
                const shape = channel === "next" ? /^\d+\.\d+\.\d+-next\.\d+$/ : /^\d+\.\d+\.\d+$/;
                // A -next package depends on its siblings only as `npm:@sealant/<sibling>-next@<this version>`;
                // anything else (and any alias at all outside the -next packages) is refused.
                const isNextPackage = /^@sealant\/[a-z0-9-]+-next$/.test(String(manifest.name));
                const dependencyProblems = ["dependencies", "peerDependencies", "optionalDependencies"].flatMap(
                  (field) =>
                    Object.entries(manifest[field] ?? {}).flatMap(([dependency, spec]) => {
                      const alias = String(spec).startsWith("npm:");
                      if (!dependency.startsWith("@sealant/")) {
                        return alias ? [`${dependency} is an alias (${spec})`] : [];
                      }
                      const expected = `npm:${dependency}-next@${version}`;
                      if (isNextPackage) return spec === expected ? [] : [`${dependency}@${spec}, not ${expected}`];
                      return alias ? [`${dependency} is an alias (${spec})`] : [];
                    }),
                );
                const problems = [
                  channel === "next" && name !== "@sealant/mend" && !isNextPackage &&
                    `${manifest.name} is not a -next package`,
                  ...dependencyProblems,
                  manifest.name !== name && `name ${manifest.name}, not ${name}`,
                  manifest.version !== version && `version ${manifest.version}, not ${version}`,
                  !shape.test(String(manifest.version)) && `${manifest.version} is not a ${channel} version`,
                  manifest.gitHead !== commit && `gitHead ${manifest.gitHead}, not ${commit}`,
                  fs.existsSync(path.join(dir, "binding.gyp")) && "a binding.gyp, which npm turns into an install script",
                ].filter(Boolean);
                if (problems.length > 0) {
                  console.error(`::error::${name}: ${problems.join("; ")}`);
                  process.exit(1);
                }
                fs.writeFileSync(path.join(dir, "package.json"), `${JSON.stringify(manifest, null, 2)}\n`);
              };
              run().catch((error) => {
                console.error(`::error::${name}: ${error.message}`);
                process.exit(1);
              });
            ' "$pacote" "$tarball" "$work/package" "$name" "$version" "$commit" "$channel" "$KEEP_FIELDS" >&2
            # A packed .npmrc would configure the pack below; nothing else in the tree runs.
            find "$work/package" -name .npmrc -delete
            packed=$(cd "$work/package" && npm pack --ignore-scripts --json --pack-destination "$work")
            printf '%s/%s\n' "$work" "$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[0].filename)' "$packed")"
          }

          # Publishes <tarball> as <name>@<version> from <commit> under <channel>; extra npm flags follow.
          # A version already published from this commit is done; from another commit, refused. Under next,
          # refused unless newer than the current next, read right before publishing, so a re-run of an old
          # job cannot move next back.
          publish_rebuilt() {
            local tarball=$1 name=$2 version=$3 commit=$4 channel=$5 from current rebuilt
            shift 5
            from=$(published_from "$name" "$version")
            if [[ -n $from ]]; then
              if [[ $from != "$commit" ]]; then
                echo "::error::$name@$version was published from $from, not $commit."
                return 1
              fi
              echo "$name@$version is already published from this commit."
              return 0
            fi
            if [[ $channel == next ]]; then
              current=$(dist_tag "$name" next)
              if [[ -n $current ]] && ! newer "$version" "$current"; then
                echo "::error::$name's next is already $current, not older than $version. Nothing was published."
                return 1
              fi
            fi
            rebuilt=$(rebuild_tarball "$tarball" "$name" "$version" "$commit" "$channel")
            npm publish "$rebuilt" --tag "$channel" --access public --ignore-scripts "$@"
          }
          # --- end republish ---

          version="${GITHUB_REF_NAME#cli-}"
          version="${version#v}"
          channel=latest
          if [[ "$version" == *-* ]]; then channel=next; fi
          artifacts="$GITHUB_WORKSPACE/tarballs"
          tarball="sealant-mend-$version.tgz"
          check_artifacts "$artifacts" "$tarball"
          # Every npm command runs from an empty directory: no project .npmrc can reach it.
          cd "$(mktemp -d)"
          publish_rebuilt "$artifacts/$tarball" "@sealant/mend" "$version" "$GITHUB_SHA" "$channel" --provenance

  # Attach setup assets at the canonical /releases/download/vVERSION URLs.
  github-release:
    name: Publish and verify setup assets
    needs: images
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#cli-}"
          VERSION="${VERSION#v}"
          if [[ "$VERSION" == *-* ]]; then
            cat > release-notes.md <<NOTES
          A \`next\` build of Mend from main at $GITHUB_SHA. It passed the packaged acceptance; it is
          not a release. Install it with \`npm install --global @sealant/mend@next\`, then
          \`mend server setup\` or \`mend server upgrade --version $VERSION\`. Read
          https://docs.mend.run/getting-started/try-a-preview/ before you do: a server on a next
          build moves forward only, to a later next build or to the stable release that follows.
          NOTES
          else
          awk -v version="$VERSION" '
            $0 ~ "^## " version "$" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' apps/cli/CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION — using a pointer instead." >&2
            echo "See apps/cli/CHANGELOG.md." > release-notes.md
          fi
          fi
          # One version stamps every artifact — list them so the release
          # object is the complete record of what this tag produced.
          cat >> release-notes.md <<NOTES

          ---

          npm publication follows verification of these public setup assets. The stable latest
          pointers advance only after npm publication succeeds.

          **Artifacts of this release**
          - npm: [\`@sealant/mend@$VERSION\`](https://www.npmjs.com/package/@sealant/mend/v/$VERSION)
          - \`ghcr.io/sealant-sh/mend-api:$VERSION\` — API tier (contract, engine, workers)
          - \`ghcr.io/sealant-sh/mend-web:$VERSION\` — web tier (nitro app + /api relay)
          - \`ghcr.io/sealant-sh/mend:$VERSION\` — complete application bundle; Postgres runs separately
          - Versioned Docker setup assets attached below; \`mend server setup\` manages them
          NOTES
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#cli-}"
          VERSION="${VERSION#v}"
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          assets=(deploy/docker/compose.v2.yaml deploy/docker/postgres-init.sh deploy/docker/setup-contract.v2.json install.sh)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Retry partial uploads without replacing an already published asset.
            existing="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            for source in "${assets[@]}"; do
              if ! grep -Fqx "${source##*/}" <<< "$existing"; then
                gh release upload "$GITHUB_REF_NAME" "$source"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" "${assets[@]}" \
              --title "Mend ${VERSION}" \
              --notes-file release-notes.md \
              --latest=false \
              --verify-tag
          fi
      - name: Verify anonymous setup downloads before npm publication
        run: |
          set -euo pipefail
          downloads="$(mktemp -d)"
          trap 'rm -rf "$downloads"' EXIT
          for source in deploy/docker/compose.v2.yaml deploy/docker/postgres-init.sh deploy/docker/setup-contract.v2.json install.sh; do
            asset="${source##*/}"
            curl -q --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 60 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset" \
              --output "$downloads/$asset"
            cmp "$source" "$downloads/$asset"
          done

  promote-images:
    name: Promote the complete stable release
    needs: [npm, github-release]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Update latest after release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#cli-}"
          version="${version#v}"
          if [[ "$version" == *-* ]]; then exit 0; fi
          for image in mend mend-api mend-web; do
            repository="ghcr.io/$GITHUB_REPOSITORY_OWNER/$image"
            docker buildx imagetools create --tag "$repository:latest" "$repository:$version"
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest

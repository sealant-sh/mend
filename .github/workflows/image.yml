name: Image

# Publish immutable candidate tags first. The caller promotes stable latest tags
# only after native packaged acceptance, npm publication, and release assets.
on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Exact candidate version; otherwise use a dev version from this commit"
        required: false
        type: string

# Only the jobs that push hold packages: write.
permissions:
  contents: read

jobs:
  version:
    if: github.repository == 'sealant-sh/mend'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      value: ${{ steps.resolve.outputs.version }}
      before: ${{ steps.resolve.outputs.before }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      # A dispatch of image.yml itself pushes ghcr.io/sealant-sh/mend:<version>, the tag
      # `mend server setup` pulls: from main only, and only for a version that has its git tag (built
      # from that tag's commit, not main's head), or a dev or acceptance build. A call from
      # release-acceptance.yml or release-cli.yml carries its caller's event and ref, so the check
      # reads github.workflow_ref, the top-level workflow, and builds the caller's commit.
      - name: Choose the commit to build
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          commit=$GITHUB_SHA
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch &&
            $GITHUB_WORKFLOW_REF == "$GITHUB_REPOSITORY/.github/workflows/image.yml@"* ]]; then
            if [[ $GITHUB_REF != refs/heads/main ]]; then
              echo "::error::Dispatch image.yml from main only."
              exit 1
            fi
            case $OVERRIDE_VERSION in
              "" | 0.0.0-dev.* | 0.0.0-acceptance.*) ;;
              *)
                # git/ref names exactly one ref (a prefix or a branch never matches); an annotated
                # tag is peeled to its commit.
                if ! ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$OVERRIDE_VERSION" \
                  --jq '.object.type + " " + .object.sha' 2>/dev/null); then
                  echo "::error::No tag v$OVERRIDE_VERSION: a dispatch builds a tagged version or a dev build."
                  exit 1
                fi
                commit=${ref##* }
                if [[ ${ref%% *} == tag ]]; then
                  commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$commit" --jq .object.sha)
                fi
                [[ $commit =~ ^[0-9a-f]{40}$ ]] || {
                  echo "::error::v$OVERRIDE_VERSION does not name a commit."
                  exit 1
                }
                ;;
            esac
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Resolve one version for image labels and tags
        id: resolve
        env:
          OVERRIDE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const { GITHUB_REF, GITHUB_REF_NAME, GITHUB_SHA, GITHUB_OUTPUT, OVERRIDE_VERSION } = process.env;
          const tagged = GITHUB_REF.startsWith('refs/tags/');
          const tagVersion = tagged ? GITHUB_REF_NAME.replace(/^v/, '') : undefined;
          if (tagged && OVERRIDE_VERSION && OVERRIDE_VERSION !== tagVersion) {
            throw new Error('A release tag cannot be overridden with another version.');
          }
          const version = OVERRIDE_VERSION || tagVersion || `0.0.0-dev.sha${GITHUB_SHA.slice(0, 12)}`;
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?$/.exec(version);
          if (!match || (match[4]?.split('.') ?? []).some(p => !/^[0-9A-Za-z-]+$/.test(p) || /^0\d+$/.test(p))) {
            throw new Error('Expected an exact Docker-compatible Mend semantic version.');
          }
          const before = `0.0.0-acceptance.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`;
          appendFileSync(GITHUB_OUTPUT, `version=${version}\nbefore=${before}\n`);
          NODE

  build:
    permissions:
      contents: read
      packages: write
    needs: version
    strategy:
      matrix:
        image:
          - { id: mend, name: mend, dockerfile: Dockerfile, baseline: false }
          - { id: mend-before, name: mend, dockerfile: Dockerfile, baseline: true }
          - { id: mend-api, name: mend-api, dockerfile: apps/api/Dockerfile, baseline: false }
          - { id: mend-web, name: mend-web, dockerfile: apps/web/Dockerfile, baseline: false }
        platform:
          - { arch: amd64, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { arch: arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args:
            MEND_VERSION=${{ matrix.image.baseline && needs.version.outputs.before ||
            needs.version.outputs.value }}
          outputs:
            type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name
            }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image.id }}--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    permissions:
      contents: read
      packages: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [version, build]
    strategy:
      matrix:
        image:
          - { id: mend, name: mend, baseline: false }
          - { id: mend-before, name: mend, baseline: true }
          - { id: mend-api, name: mend-api, baseline: false }
          - { id: mend-web, name: mend-web, baseline: false }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image.id }}--*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and inspect the multi-arch candidate
        working-directory: /tmp/digests
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          VERSION:
            ${{ matrix.image.baseline && needs.version.outputs.before || needs.version.outputs.value
            }}
        run: |
          set -euo pipefail
          # A version is pushed once. Overwriting ghcr.io/sealant-sh/mend:<version> would change
          # what every server pinned to it pulls. Only a commit's own dev build may be rebuilt.
          if [[ $VERSION != 0.0.0-dev.* && $VERSION != 0.0.0-acceptance.* ]] &&
            docker buildx imagetools inspect "$REPOSITORY:$VERSION" >/dev/null 2>&1; then
            echo "::error::$REPOSITORY:$VERSION already exists; a version is pushed once."
            exit 1
          fi
          sources=()
          for digest in *; do sources+=("$REPOSITORY@sha256:$digest"); done
          docker buildx imagetools create --tag "$REPOSITORY:$VERSION" "${sources[@]}"
          docker buildx imagetools inspect "$REPOSITORY:$VERSION"

  packaged-smoke:
    name: Packaged Mend acceptance
    needs: [version, merge]
    strategy:
      matrix:
        runner: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-ubuntu-2404-arm]
    runs-on: ${{ matrix.runner }}
    # Usually ~18 min; v0.35.0's amd64 run took 27.6 (its Ubuntu dotfiles scenario 760 s against
    # 67 s on arm64), 2.4 min inside the old 30. A cold workspace image build on a slow mirror is
    # not a failed release.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stamp and exercise the actual release package
        env:
          MEND_TEST_IMAGE:
            ghcr.io/${{ github.repository_owner }}/mend:${{ needs.version.outputs.before }}
          MEND_TEST_VERSION: ${{ needs.version.outputs.before }}
          MEND_TEST_UPGRADE_IMAGE:
            ghcr.io/${{ github.repository_owner }}/mend:${{ needs.version.outputs.value }}
          MEND_TEST_UPGRADE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          pnpm --filter @sealant/mend exec npm version "$MEND_TEST_UPGRADE_VERSION" --no-git-tag-version --allow-same-version
          node scripts/check-packaged-server.mjs

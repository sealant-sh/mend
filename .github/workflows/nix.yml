name: nix

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - patches/**
      - apps/cli/**
      - packages/**
      - tooling/**
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build the mend CLI
        run: nix build .#mend -L
      - name: Run the built CLI
        run: ./result/bin/mend --version

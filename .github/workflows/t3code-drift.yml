# The t3code gateway's drift job (docs/adr/0012, phase 4). Once a day it compares the contracts
# packages/t3-contracts vendors with t3code's newest nightly tag, by git blob id. On drift it opens
# one issue, or comments on the open one when the tag is new to it; it never moves the pin, which
# a person does with `pnpm --filter @mend/t3-contracts sync --tag <tag>`.
name: t3code drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: t3code-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Compare the pinned contracts with t3code's newest nightly
        id: drift
        run: |
          set +e
          node packages/t3-contracts/scripts/drift.ts --out "$RUNNER_TEMP/drift.md" | tee "$RUNNER_TEMP/drift.txt"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = 2 ]; then exit 1; fi
          echo "drift=$([ "$code" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tag=$(grep -oE 'v[0-9.]+-nightly\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/drift.txt" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Open or update the drift issue
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.drift.outputs.tag }}
        run: |
          title="t3code contracts drifted from the gateway's pin"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/drift.md"
          elif ! gh issue view "$number" --json body,comments --jq '[.body, .comments[].body] | join("\n")' | grep -qF "$TAG"; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/drift.md"
          else
            echo "issue #$number already names $TAG"
          fi

name: Nightly watch

# The nightly CI run (ci.yml's schedule) tests the full graph from scratch: it is the backstop for
# merge groups that run only what their pull requests affect (docs/operations/merge-queue.md). A
# red or missing nightly reaches no pull request, so this keeps one open `nightly-failure` issue:
# it comments on it, or opens it, when a scheduled run does not succeed, and when no scheduled run
# on main has succeeded for 30 hours (GitHub can start a schedule hours late, or not at all).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

concurrency:
  group: nightly-watch
  cancel-in-progress: false

jobs:
  alert:
    # It reads run metadata and writes one issue; it never checks out or runs repository code.
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion != 'success')
    runs-on: [self-hosted, box, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Report a failed or missing nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            failed=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name) (\(.conclusion))"] | join(", ")')
            body="The nightly full CI run on main ended **$RUN_CONCLUSION**: $RUN_URL (head \`$RUN_SHA\`). Jobs: ${failed:-none reported}."
          else
            last=$(gh run list --workflow ci.yml --event schedule --branch main --status success \
              --limit 1 --json createdAt --jq '.[0].createdAt // empty')
            age=$(( $(date -u +%s) - $(date -u -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
            if [ "$age" -le $(( 30 * 3600 )) ]; then
              echo "Last successful nightly: $last"
              exit 0
            fi
            body="No scheduled CI run on main has succeeded in 30 hours (last success: ${last:-none}). The nightly full-graph run is the backstop for affected-only merge groups."
          fi
          open=$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create nightly-failure --color B60205 \
              --description "The nightly full CI run failed or did not run" 2>/dev/null || true
            gh issue create --label nightly-failure --title "The nightly full CI run failed or did not run" \
              --body "$body"
          fi

name: Nightly watch

# The nightly CI run (ci.yml's schedule) tests the full graph from scratch: it is the backstop for
# merge groups that run only what their pull requests affect (docs/operations/merge-queue.md). The
# nightly build input probe (build-input-probe.yml) proves the hashes that selection relies on. A
# red or missing nightly reaches no pull request, so this keeps one open `nightly-failure` issue:
# it comments on it, or opens it, when a scheduled run of either does not succeed, and when either
# has had no successful scheduled run on main for 30 hours (GitHub can start a schedule hours late,
# or not at all). It runs on a GitHub-hosted runner so that a box outage can't silence it.
on:
  workflow_run:
    workflows: [CI, Build input probe]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

concurrency:
  group: nightly-watch
  cancel-in-progress: false

jobs:
  alert:
    # It reads run metadata and writes one issue; it never checks out or runs repository code.
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report a failed or missing nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            failed=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name) (\(.conclusion))"] | join(", ")')
            body="The nightly $RUN_NAME run on main ended **$RUN_CONCLUSION**: $RUN_URL (head \`$RUN_SHA\`). Jobs: ${failed:-none reported}."
          else
            body=
            for workflow in ci.yml build-input-probe.yml; do
              last=$(gh run list --workflow "$workflow" --event schedule --branch main --status success \
                --limit 1 --json createdAt --jq '.[0].createdAt // empty')
              age=$(( $(date -u +%s) - $(date -u -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
              if [ "$age" -le $(( 30 * 3600 )) ]; then
                echo "Last successful nightly $workflow: $last"
              else
                body+="No scheduled $workflow run on main has succeeded in 30 hours (last success: ${last:-none}). "
              fi
            done
            [ -n "$body" ] || exit 0
            body+="The nightly full-graph run and the build input probe are the backstop for affected-only merge groups."
          fi
          open=$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create nightly-failure --color B60205 \
              --description "A nightly CI run failed or did not run" 2>/dev/null || true
            gh issue create --label nightly-failure --title "A nightly CI run failed or did not run" \
              --body "$body"
          fi

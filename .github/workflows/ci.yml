name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every install reads the committed lockfile, so a package published after the commit (a
      # Sealant prerelease included) never drifts in. The brackets keep this step from matching
      # itself.
      - name: Installs stay bound to the lockfile
        run: |
          if git grep -nE 'lockfile[=]false|PNPM_CONFIG_LOCKFIL[E]|no-frozen-lockfil[e]' -- \
            .github Dockerfile 'apps/*/Dockerfile' 'scripts/*.sh' 'tooling/**'; then
            echo "::error::Install with --frozen-lockfile, not without the lockfile."
            exit 1
          fi
      # Build first: the vite builds generate the gitignored routeTree.gen.ts
      # files that typecheck needs — CI was red for weeks on exactly this.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Check packaging contracts, supervision, acceptance helpers, and the Helm chart
        run:
          node --test scripts/bundle-packaging.test.mjs scripts/process-supervisor.test.mjs
          scripts/check-packaged-server.test.mjs scripts/release-publication.test.mjs
          scripts/packaged-ssh-acceptance.test.mjs scripts/packaged-git-access-acceptance.test.mjs
          scripts/packaged-dotfiles-acceptance.test.mjs scripts/helm-chart.test.mjs
          scripts/edge-overlay.test.mjs scripts/aws-compose.test.mjs scripts/aws-tofu.test.mjs
          scripts/next-version.test.mjs scripts/sealant-pins.test.mjs
          scripts/check-release-pins.test.mjs
      - run: helm lint deploy/helm/mend -f deploy/helm/mend/ci/obc-values.yaml

name: CI

# A pull request runs what its change affects. Every push to main runs the full graph on exactly
# the commit that landed, and is the trusted cache writer. The nightly run tests everything again
# with --force, reading no cache.
on:
  pull_request:
  push:
    branches: [main]
  # The Version Packages pull request's bot-authored pull_request run stops at the repository's
  # contributor approval policy; version.yml's approve-checks job approves it so `checks` reports
  # there. A dispatched run does not show in a pull request's checks.
  # The x86 jobs run on GitHub's ubuntu-24.04, free for this public repository. A dispatch with
  # `runner: box` sends them back to the box's self-hosted runners; no other event can reach it.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the x86 jobs (box is the fallback; other events use ubuntu-24.04)
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - box
      formal:
        description: Bounds for the formal models (full is what the nightly run checks)
        type: choice
        default: quick
        options:
          - quick
          - full
  schedule:
    - cron: "23 2 * * *"

# Checks read the repository and write nothing.
# Box runners provide a persistent pnpm store, so setup-node restores GitHub's pnpm cache only off
# the box. Turbo's box cache (scripts/ci-turbo.mjs) is reachable only from the box, so hosted runs
# start cold.
permissions:
  contents: read

env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

# A pull request and a dispatched branch keep only their newest run: an older head's result is never
# what the required check reads. Pushes to main and nightly runs each get their own group and are
# never cancelled: every commit that lands keeps its own result.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name ==
    'workflow_dispatch' && github.ref) || github.run_id }}
  cancel-in-progress:
    ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

# Every job has a time limit, so one hung step cannot hold a main run for GitHub's default six
# hours (SLNT-1076). Each is about three times the job's slowest time on the 20 main runs before
# 16 Nov, rounded up to five minutes and never under ten: room for a slow runner and for a bounded
# install's retries (scripts/ci-bounded.sh). vscode-e2e keeps the limit it had; formal's fits its
# models' budgets (the comment above it).
jobs:
  # `changes` and `checks` are seconds of work on GitHub's arm64 runners, free for this public
  # repository, so neither waits for an x86 slot. On the box, run 38746126993's 10-second `checks`
  # waited 13.4 minutes behind sealant and sealantd runs.
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      CI_TEST_REPORT_DIR: ${{ github.workspace }}/.ci-reports/test
    outputs:
      mobile: ${{ steps.scope.outputs.mobile }}
      packaging: ${{ steps.scope.outputs.packaging }}
      store: ${{ steps.scope.outputs.store }}
      formal: ${{ steps.scope.outputs.formal }}
      docker: ${{ steps.scope.outputs.docker }}
      preview: ${{ steps.scope.outputs.preview }}
      vscode: ${{ steps.scope.outputs.vscode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Verify local CI selection
        run:
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/ci-node-reporter.mjs --test-reporter-destination=stderr
          --test-reporter=./scripts/ci-test-report.mjs --test-reporter-destination=stdout
          scripts/ci-scope.test.mjs
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Pushes to main, nightly and dispatched runs select every extra.
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node scripts/ci-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-scope.mjs --all >> "$GITHUB_OUTPUT"
          fi

      - name: Archive per-file test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name:
            test-report-${{ github.job }}${{ hashFiles('.ci-reports/test/retried-*.json') != '' &&
            '-retried' || '' }}
          path: .ci-reports/test/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  static:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      CI_TEST_REPORT_DIR: ${{ github.workspace }}/.ci-reports/test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Configure Turbo cache and runtime identity
        run: node scripts/ci-turbo.mjs configure >> "$GITHUB_ENV"
      - name: Exercise CI guards against both installed Vitest versions
        run: pnpm --filter @mend/test-ci test:integration
      - name: Verify CI selection and required results
        run:
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/ci-node-reporter.mjs --test-reporter-destination=stderr
          --test-reporter=./scripts/ci-test-report.mjs --test-reporter-destination=stdout
          scripts/ci-scope.test.mjs scripts/test-only-imports.test.mjs
          scripts/remove-package-tests.test.mjs scripts/ci-workflow.test.mjs
          scripts/ci-images.test.mjs scripts/ci-turbo.test.mjs scripts/ci-cache.test.mjs
          scripts/ci-web-size.test.mjs scripts/ci-test-inputs.test.mjs tooling/verify/plan.test.mjs
          tooling/verify/verify.test.mjs tooling/verify/box.test.mjs tooling/verify/stack.test.mjs
          tooling/verify/health.test.mjs tooling/verify/drive.test.mjs
          tooling/verify/formal.test.mjs tooling/verify/gate.test.mjs
          tooling/verify/box-tidy.test.mjs tooling/verify/ports.test.mjs
      - name: Verify timing analysis against source budgets
        run:
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/ci-node-reporter.mjs --test-reporter-destination=stderr
          --test-reporter=./scripts/ci-test-report.mjs --test-reporter-destination=stdout
          scripts/ci-timings.test.mjs scripts/ci-runtime-timings.test.mjs scripts/ci-flakes.test.mjs
      # The publisher checks its tarball with an inline copy of normalize-npm-tarball.mjs --check, so
      # it runs no repository code beside its id-token. The two copies can drift from either side, so
      # their parity test runs on every pull request, whatever the change's scope.
      - name: Verify the publisher's inline tarball check against the normalizer
        run:
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/ci-node-reporter.mjs --test-reporter-destination=stderr
          --test-reporter=./scripts/ci-test-report.mjs --test-reporter-destination=stdout
          scripts/republish.test.mjs scripts/normalize-npm-tarball.test.mjs
          scripts/republish.registry.test.mjs scripts/republish.floor.test.mjs
          scripts/republish.overrides.test.mjs scripts/ci-node-reporter.test.mjs
          scripts/ci-test-report.test.mjs
      - run: node scripts/ci-shards.mjs --check
      # Every install reads the committed lockfile, so a package published after the commit (a
      # Sealant prerelease included) never drifts in. The brackets keep this step from matching
      # itself.
      - name: Installs stay bound to the lockfile
        run: |
          if git grep -nE 'lockfile[=]false|PNPM_CONFIG_LOCKFIL[E]|no-frozen-lockfil[e]' -- \
            .github Dockerfile 'apps/*/Dockerfile' 'scripts/*.sh' 'tooling/**'; then
            echo "::error::Install with --frozen-lockfile, not without the lockfile."
            exit 1
          fi
      # Cached builds restore generated routes before their own typecheck.
      - run: node scripts/ci-turbo.mjs build typecheck lint
      # What a browser downloads before the new web app draws (its entry chunk and the sign-in
      # page), read from the build above against apps/web/size-budget.json. A change that doesn't
      # affect @mend/web builds nothing here and skips it.
      - name: The new web app's first load stays within its budget
        run: node scripts/ci-web-size.mjs
      # The recipes belong to no package, so Turbo's lint never reads them; `pnpm verify check`
      # lints them with this command (tooling/verify/check.mjs, GATE_STEPS).
      - name: Verify recipes lint
        run: pnpm exec oxlint --deny-warnings .agents/skills/verify/recipes
      - run: pnpm format:check
      # This was unconditional in checks, so it remains independent of packaging scope.
      - run: helm lint deploy/helm/mend -f deploy/helm/mend/ci/obc-values.yaml

      - name: Archive Turbo task hashes and cache outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turbo-${{ github.job }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive per-file test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name:
            test-report-${{ github.job }}${{ hashFiles('.ci-reports/test/retried-*.json') != '' &&
            '-retried' || '' }}
          path: .ci-reports/test/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  test-engines:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 50
    # packages: read lets scripts/ci-images.mjs read CI's image copies on GHCR with the job's token.
    permissions:
      contents: read
      packages: read
    env:
      CI_TEST_REPORT_DIR: ${{ github.workspace }}/.ci-reports/test
      MEND_TEST_DATABASE_URL: postgres://mend:mend@localhost:5432/mend
      MEND_TEST_RFB_XVNC_BASE: debian:trixie-slim
      # ubuntu-24.04 has 4 CPUs. The shard runner runs two packages at once, so two workers each keep
      # the lane at one worker per CPU; with three each, a file took up to twice as long (SLNT-1040).
      VITEST_MAX_THREADS: "2"
      VITEST_MAX_FORKS: "2"
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      # Postgres 17 for the database tests, without durability, pulled from CI's GHCR copy, then ECR
      # Public, then mirror.gcr.io (scripts/ci-images.mjs): a `services:` container has one source and
      # GitHub's own three tries, and ECR Public's limits failed it (SLNT-1071).
      - name: Start the throwaway Postgres
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-images.mjs postgres
      - run: pnpm install --frozen-lockfile
      - name: Configure Turbo cache and runtime identity
        run: node scripts/ci-turbo.mjs configure >> "$GITHUB_ENV"
      # The sessions tests' fixture bases, through scripts/ci-images.mjs (CI's GHCR copy, then the
      # public mirrors, with retries): the shell-profile image's, the rfb Xvnc image's (named by
      # MEND_TEST_RFB_XVNC_BASE) and the pre-release check's.
      - name: Pull the test fixtures' base images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-images.mjs pull alpine:3.22 debian:trixie-slim alpine:3.20
      - name: Build isolated zsh fixture for default shell-profile tests
        run:
          docker build --build-arg BASE=alpine:3.22 -t mend-shell-profile-test:alpine-3.22
          packages/sessions/test/fixtures/shell-profile
      - name: Tests including required PostgreSQL repositories, migrations and jobs
        run: node scripts/ci-shards.mjs engines

      - name: Archive Turbo task hashes and cache outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turbo-${{ github.job }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive per-file test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name:
            test-report-${{ github.job }}${{ hashFiles('.ci-reports/test/retried-*.json') != '' &&
            '-retried' || '' }}
          path: .ci-reports/test/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  test-engines-b:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 30
    # packages: read lets scripts/ci-images.mjs read CI's image copies on GHCR with the job's token.
    permissions:
      contents: read
      packages: read
    env:
      CI_TEST_REPORT_DIR: ${{ github.workspace }}/.ci-reports/test
      MEND_TEST_DATABASE_URL: postgres://mend:mend@localhost:5432/mend
      MEND_TEST_RFB_XVNC_BASE: debian:trixie-slim
      # ubuntu-24.04 has 4 CPUs. The shard runner runs two packages at once, so two workers each keep
      # the lane at one worker per CPU; with three each, a file took up to twice as long (SLNT-1040).
      VITEST_MAX_THREADS: "2"
      VITEST_MAX_FORKS: "2"
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      # Postgres 17 for the database tests, without durability, pulled from CI's GHCR copy, then ECR
      # Public, then mirror.gcr.io (scripts/ci-images.mjs): a `services:` container has one source and
      # GitHub's own three tries, and ECR Public's limits failed it (SLNT-1071).
      - name: Start the throwaway Postgres
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-images.mjs postgres
      - run: pnpm install --frozen-lockfile
      - name: Configure Turbo cache and runtime identity
        run: node scripts/ci-turbo.mjs configure >> "$GITHUB_ENV"
      # The sessions tests' fixture bases, through scripts/ci-images.mjs (CI's GHCR copy, then the
      # public mirrors, with retries): the shell-profile image's, the rfb Xvnc image's (named by
      # MEND_TEST_RFB_XVNC_BASE) and the pre-release check's.
      - name: Pull the test fixtures' base images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-images.mjs pull alpine:3.22 debian:trixie-slim alpine:3.20
      - name: Build isolated zsh fixture for default shell-profile tests
        run:
          docker build --build-arg BASE=alpine:3.22 -t mend-shell-profile-test:alpine-3.22
          packages/sessions/test/fixtures/shell-profile
      - name: API server tests and sessions native shard 2/2
        run: node scripts/ci-shards.mjs engines-b

      - name: Archive Turbo task hashes and cache outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turbo-${{ github.job }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive per-file test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name:
            test-report-${{ github.job }}${{ hashFiles('.ci-reports/test/retried-*.json') != '' &&
            '-retried' || '' }}
          path: .ci-reports/test/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  test-clients-a:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 35
    # packages: read lets scripts/ci-images.mjs read CI's image copies on GHCR with the job's token.
    permissions:
      contents: read
      packages: read
    env:
      CI_TEST_REPORT_DIR: ${{ github.workspace }}/.ci-reports/test
      # Two packages at once on 4 CPUs: two workers each, as in the engine lanes (SLNT-1040).
      VITEST_MAX_THREADS: "2"
      VITEST_MAX_FORKS: "2"
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Configure Turbo cache and runtime identity
        run: node scripts/ci-turbo.mjs configure >> "$GITHUB_ENV"
      # Desktop's font-browser regression launches Chromium unconditionally in this job.
      - name: Install Chromium for desktop browser tests
        # The runner image already carries Chromium's system libraries; when its apt mirror is down
        # or stalls, install the browser alone rather than fail the lane before a test runs. Each
        # part is bounded (scripts/ci-bounded.sh): a stall says so in minutes, not at the job's limit.
        run:
          scripts/ci-bounded.sh "Chromium with its system packages" 4 1 -- pnpm --filter
          @mend/mobile exec playwright-core install --with-deps --only-shell chromium ||
          scripts/ci-bounded.sh "The Chromium download" 4 2 -- pnpm --filter @mend/mobile exec
          playwright-core install --only-shell chromium
      # The old checks build copied this tracked installer before marketing tests.
      - name: Prepare the marketing installer in this checkout
        run: node apps/marketing/scripts/sync-install-script.mjs
      - name: CLI, client and shared-library tests
        run: node scripts/ci-shards.mjs clients-a
      # The desktop app, built and launched under Xvfb, follows a terminal's `mend logout` and
      # `mend login`: the main process sees the shared credential change and the window shows it
      # (apps/desktop/scripts/check-connection.mjs). The Chromium install above brings Electron's
      # system libraries.
      - name: The desktop window follows the connection the main process reports
        run: |
          pnpm exec turbo run build --filter=@mend/desktop
          xvfb-run -a pnpm --filter @mend/desktop check:connection
      - name: AWS shell regression tests with local command fixtures
        run: pnpm run test:aws-shell
      - name: Identify the pinned MinIO fixture cache
        id: minio
        run: node scripts/s3-contract-minio.mjs >> "$GITHUB_OUTPUT"
      - name: Cache the pinned MinIO binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.minio.outputs.path }}
          key: ${{ steps.minio.outputs.key }}
      - name: MinIO fixture cache and download regressions
        run:
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/ci-node-reporter.mjs --test-reporter-destination=stderr
          --test-reporter=./scripts/ci-test-report.mjs --test-reporter-destination=stdout
          scripts/s3-contract-minio.test.mjs
      - name: Live S3 contracts on disposable Garage and strict MinIO fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run test:s3-contract
      - name: CI shard process supervision regressions
        run:
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/ci-node-reporter.mjs --test-reporter-destination=stderr
          --test-reporter=./scripts/ci-test-report.mjs --test-reporter-destination=stdout
          scripts/ci-shards.test.mjs

      - name: Archive Turbo task hashes and cache outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turbo-${{ github.job }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive per-file test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name:
            test-report-${{ github.job }}${{ hashFiles('.ci-reports/test/retried-*.json') != '' &&
            '-retried' || '' }}
          path: .ci-reports/test/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  test-clients-b:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      CI_TEST_REPORT_DIR: ${{ github.workspace }}/.ci-reports/test
      # Two packages at once on 4 CPUs: two workers each, as in the engine lanes (SLNT-1040).
      VITEST_MAX_THREADS: "2"
      VITEST_MAX_FORKS: "2"
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Configure Turbo cache and runtime identity
        run: node scripts/ci-turbo.mjs configure >> "$GITHUB_ENV"
      - name: CLI, client and shared-library tests
        run: node scripts/ci-shards.mjs clients-b
      # The built web app loads in a real browser and renders its first screen: the sign-in page,
      # served by the production front with no API behind it (apps/web-old/scripts/check-browser.mjs).
      - name: Install Chromium for the web app's browser check
        # The runner image already carries Chromium's system libraries; when its apt mirror is down
        # or stalls, install the browser alone rather than fail the lane before a test runs. Each
        # part is bounded (scripts/ci-bounded.sh): a stall says so in minutes, not at the job's limit.
        run:
          scripts/ci-bounded.sh "Chromium with its system packages" 4 1 -- pnpm --filter
          @mend/mobile exec playwright-core install --with-deps --only-shell chromium ||
          scripts/ci-bounded.sh "The Chromium download" 4 2 -- pnpm --filter @mend/mobile exec
          playwright-core install --only-shell chromium
      - name: The built web app renders its sign-in page in Chromium
        env:
          # The workspace's locked Playwright, as the packaging job's verify tests use it.
          MEND_VERIFY_PLAYWRIGHT: ${{ github.workspace }}/apps/mobile
        run: |
          pnpm exec turbo run build --filter=@mend/web-old
          pnpm --filter @mend/web-old check:browser
      # The new web app (apps/web, ADR 0027) is held to the same until it replaces the old one. Its
      # sign-in page needs the server to answer, so its check puts a fake API behind the front
      # (apps/web/scripts/check-browser.mjs).
      - name: The built new web app renders its sign-in page in Chromium
        env:
          MEND_VERIFY_PLAYWRIGHT: ${{ github.workspace }}/apps/mobile
        run: |
          pnpm exec turbo run build --filter=@mend/web
          pnpm --filter @mend/web check:browser

      - name: Archive Turbo task hashes and cache outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turbo-${{ github.job }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive per-file test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name:
            test-report-${{ github.job }}${{ hashFiles('.ci-reports/test/retried-*.json') != '' &&
            '-retried' || '' }}
          path: .ci-reports/test/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  packaging:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.packaging != 'false' }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 20
    # packages: read lets scripts/ci-images.mjs read CI's image copies on GHCR with the job's token.
    permissions:
      contents: read
      packages: read
    env:
      CI_TEST_REPORT_DIR: ${{ github.workspace }}/.ci-reports/test
      MEND_VERIFY_PLAYWRIGHT: ${{ github.workspace }}/apps/mobile
      # The tree no longer matches the commit once package tests are removed: never write a cache.
      TURBO_CACHE: local:r,remote:r
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # The scope skips this lane for a change confined to package tests, so the lane must not
      # read them: delete them before any lane step (scripts/remove-package-tests.mjs).
      - name: Remove package tests this lane may not read
        run: node scripts/remove-package-tests.mjs
      - name: Cache OpenTofu binary
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.tool_cache }}/tofu/1.12.0
          key: ${{ runner.os }}-${{ runner.arch }}-tofu-1.12.0
      - name: Install OpenTofu for evaluated offline AWS gate tests
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.0
          tofu_wrapper: false
          cache: true
      # actions/cache refuses a path with `..` in it, so the cache lives in the runner's temp
      # directory, outside the checkout. `runner` is not available in job env, hence this step.
      - name: Name the OpenTofu provider cache
        run: echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tofu-plugin-cache" >> "$GITHUB_ENV"
      - name: Cache OpenTofu providers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          # Whole package directories: OpenTofu checks each against the lock file's hash, so the
          # binary alone fails init. They exist only after an install, so an outage saves nothing.
          path: ${{ runner.temp }}/tofu-plugin-cache/registry.opentofu.org/*/*/*/*
          key:
            ${{ runner.os }}-${{ runner.arch }}-tofu-providers-v2-${{
            hashFiles('deploy/aws/tofu/.terraform.lock.hcl') }}
      # The images the packaging tests run, through scripts/ci-images.mjs (CI's GHCR copy, then the
      # public mirrors, with retries) under their Docker Hub names: the edge overlay's Caddy, read
      # from compose.edge.yaml; the mirrors runtime test's clients and registries; the
      # upgrade-window test's busybox; and the Dockerfile's runtime base for the bundle tests.
      - name: Pull the images the packaging tests run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          caddy=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const image = readFileSync("deploy/docker/compose.edge.yaml", "utf8").match(/^\s+image: (caddy:\S+)$/m)?.[1]; if (!image) throw new Error("Missing Caddy image"); console.log(image);')
          base=$(sed -n 's/^FROM \([^ ]*\) AS runtime$/\1/p' Dockerfile)
          node scripts/ci-images.mjs pull "$caddy" "$base" curlimages/curl:8.16.0 node:24-alpine \
            nginx:1.29-alpine registry:3.1 alpine:3.20 busybox:1.37
      # Leak-evidence tests must exercise Chromium instead of skipping for a missing browser.
      # Reuse the workspace's locked Playwright version, as the mobile-web job does.
      - name: Install Chromium for verification evidence tests
        # The runner image already carries Chromium's system libraries; when its apt mirror is down
        # or stalls, install the browser alone rather than fail the lane before a test runs. Each
        # part is bounded (scripts/ci-bounded.sh): a stall says so in minutes, not at the job's limit.
        run:
          scripts/ci-bounded.sh "Chromium with its system packages" 4 1 -- pnpm --filter
          @mend/mobile exec playwright-core install --with-deps --only-shell chromium ||
          scripts/ci-bounded.sh "The Chromium download" 4 2 -- pnpm --filter @mend/mobile exec
          playwright-core install --only-shell chromium
      - name: Require the packaging tools and Docker daemon
        run: |
          docker info > /dev/null
          docker compose version
          helm version --short
          tofu version
      - name:
          Check packaging contracts, supervision, acceptance helpers, the mirrors, and the Helm
          chart
        run:
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/ci-node-reporter.mjs --test-reporter-destination=stderr
          --test-reporter=./scripts/ci-test-report.mjs --test-reporter-destination=stdout
          scripts/bundle-packaging.test.mjs scripts/process-supervisor.test.mjs
          scripts/check-packaged-server.test.mjs scripts/release-publication.test.mjs
          scripts/release-finalize.test.mjs scripts/ghcr-staging-cleanup.test.mjs
          scripts/upgrade-window.test.mjs scripts/check-split-tier.test.mjs
          scripts/packaged-ssh-acceptance.test.mjs scripts/packaged-git-access-acceptance.test.mjs
          scripts/packaged-dotfiles-acceptance.test.mjs scripts/helm-chart.test.mjs
          scripts/edge-overlay.test.mjs scripts/aws-compose.test.mjs scripts/aws-tofu.test.mjs
          scripts/next-version.test.mjs scripts/next-version.histories.test.mjs
          scripts/sealant-pins.test.mjs scripts/check-release-pins.test.mjs
          scripts/mend-migrations.test.mjs scripts/release-manifest.test.mjs
          scripts/preview-deploy.test.mjs scripts/bench/*.test.mjs scripts/mirrors-runtime.test.mjs
          scripts/verify-stack/lib.test.mjs scripts/verify-stack/lifecycle.test.mjs
          scripts/verify-stack/lifecycle.e2e.test.mjs
          scripts/verify-stack/lifecycle.locking.e2e.test.mjs
          scripts/verify-stack/lifecycle.resources.e2e.test.mjs
          scripts/verify-stack/lifecycle.recording.e2e.test.mjs
          scripts/vscode-acceptance-evidence.test.mjs scripts/ci-bounded.test.mjs
          .agents/skills/verify/scripts/leaks.test.mjs
          .agents/skills/verify/scripts/leaks.closed-roots.test.mjs
          .agents/skills/verify/scripts/leaks.frames.test.mjs
          .agents/skills/verify/scripts/slots.test.mjs .agents/skills/verify/scripts/guard.test.mjs
          .agents/skills/verify/scripts/secrets.test.mjs
          .agents/skills/verify/scripts/steps.test.mjs
          .agents/skills/verify/scripts/local-outer.test.mjs
          .agents/skills/verify/scripts/doctor.test.mjs
          .agents/skills/verify/scripts/drive-vscode.test.mjs
          .agents/skills/verify/scripts/fingerprint.test.mjs
          .agents/skills/verify/scripts/fixtures/claude-standin.test.mjs
          .agents/skills/verify/scripts/fixtures/claude-protocol-standin.test.mjs
      # The published tarball, installed from npm the way a person installs it: a CLI that packs
      # and installs but cannot start fails here (apps/cli/scripts/test-package.mjs).
      - name: Installed-CLI smoke from the packed tarball
        run: pnpm --filter @sealant/mend test:package

      - name: Archive per-file test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name:
            test-report-${{ github.job }}${{ hashFiles('.ci-reports/test/retried-*.json') != '' &&
            '-retried' || '' }}
          path: .ci-reports/test/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # The phone app's web build is what verification runs drive. It must bundle, render statically,
  # and load in a browser from both the export and the dev server (apps/mobile/scripts/check-web.mjs).
  mobile-web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mobile != 'false' }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      # The tree no longer matches the commit once package tests are removed: never write a cache.
      TURBO_CACHE: local:r,remote:r
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # The scope skips this lane for a change confined to package tests, so the lane must not
      # read them: delete them before any lane step (scripts/remove-package-tests.mjs).
      - name: Remove package tests this lane may not read
        run: node scripts/remove-package-tests.mjs
      - run:
          scripts/ci-bounded.sh "Chromium with its system packages" 4 1 -- pnpm --filter
          @mend/mobile exec playwright-core install --with-deps --only-shell chromium ||
          scripts/ci-bounded.sh "The Chromium download" 4 2 -- pnpm --filter @mend/mobile exec
          playwright-core install --only-shell chromium
      - run: pnpm --filter @mend/mobile check:web

  # The server image installs git from Debian bookworm (2.39). The runners' newer git refuses a
  # hostile tree on its own, so only a run under the image's git shows the store's handoff
  # admission doing it (scripts/store-image-git.sh).
  store-image-git:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.store != 'false' }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 10
    # packages: read lets scripts/ci-images.mjs read CI's image copies on GHCR with the job's token.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Dockerfile's runtime base, through scripts/ci-images.mjs (CI's GHCR copy, then the
      # public mirrors, with retries), so the script's `docker run` finds it here.
      - name: Pull the server image's base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-images.mjs pull "$(bash scripts/store-image-git.sh --image)"
      - name: Store handoff tests under the server image's git
        run: bash scripts/store-image-git.sh

  # Formal models (docs/formal/<area>): a pull request that reaches code a model's COVERAGE names
  # runs the drift guard (that code moved the model or its sync commit) and the quick bounds; a push
  # to main and the nightly run check every model, the nightly one (or a dispatch with
  # `formal: full`) at its full bounds. The checker is tlx, built from source at the commit
  # docs/formal/tlx.sh pins and cached by that commit: a miss builds it, a hit restores it in
  # seconds. One job per model; formal.mjs stops a model at its own budget (COVERAGE's
  # budget-full), and the job's limit is the largest budget plus 10 minutes for setup and a build
  # on a miss (2.5 to 3 minutes on the hosted runner). The full bounds take 8.4 minutes for
  # standby-discard, so pull requests keep the quick bounds (seconds).
  # The matrix lists every docs/formal/<area> with a COVERAGE (scripts/ci-workflow.test.mjs).
  formal:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.formal != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        area: [standby-discard, turn-dispatch]
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # formal.mjs needs no dependency, so the job installs nothing and asks for no pnpm cache: on a
      # key nobody has saved yet, setup-node's post step fails a job whose pnpm store does not exist.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Name the pinned tlx
        id: tlx
        run: |
          echo "commit=$(bash docs/formal/tlx.sh --commit)" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$(bash docs/formal/tlx.sh --path)")" >> "$GITHUB_OUTPUT"
      - id: tlx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tlx.outputs.dir }}
          key: tlx-${{ steps.tlx.outputs.commit }}-${{ runner.os }}-${{ runner.arch }}
      # rustup on the runner takes the rustc tlx pins (its rust-toolchain.toml).
      - name: Build tlx
        if: ${{ steps.tlx-cache.outputs.cache-hit != 'true' }}
        run: bash docs/formal/tlx.sh
      - if: ${{ steps.tlx-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tlx.outputs.dir }}
          key: ${{ steps.tlx-cache.outputs.cache-primary-key }}
      - name: Guard the models' coverage and check them
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOUNDS: ${{ inputs.formal }}
          AREA: ${{ matrix.area }}
          # The checker's progress lines in the job log, so a model its budget stopped shows how far
          # it got.
          MEND_FORMAL_PROGRESS: "1"
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node tooling/verify/formal.mjs ci "$BASE_SHA" "$HEAD_SHA" --area "$AREA"
          elif [ "$EVENT_NAME" = schedule ] || [ "$BOUNDS" = full ]; then
            node tooling/verify/formal.mjs ci - "$GITHUB_SHA" --full --area "$AREA"
          else
            node tooling/verify/formal.mjs ci - "$GITHUB_SHA" --area "$AREA"
          fi

  # The suites that need a real Docker engine and skip without one: first server setup on Docker
  # (volume ownership, the official Postgres bootstrap) and Undo on a mounted per-person workspace.
  # A change to the code they drive selects them (scripts/ci-scope.mjs); the runner fails when a
  # case skips (scripts/docker-suites.mjs).
  docker-suites:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docker != 'false' }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 15
    # packages: read lets scripts/ci-images.mjs read CI's image copies on GHCR with the job's token.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Server Docker setup and mounted Undo on the runner's Docker engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/docker-suites.mjs

  # The preview gateway's acceptance suite (apps/api/test/*.acceptance.ts): real Chromium and
  # Firefox, through direct, Caddy, nginx and tailscaled stand-in edges in Docker, against Postgres.
  # It covers cookie scope, cross-preview isolation and stream buffering, which the unit tests
  # cannot reach. A change to the gateway, its edges or the suite selects it (scripts/ci-scope.mjs).
  preview-acceptance:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.preview != 'false' }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 25
    # packages: read lets scripts/ci-images.mjs read CI's image copies on GHCR with the job's token.
    permissions:
      contents: read
      packages: read
    env:
      MEND_TEST_DATABASE_URL: postgres://mend:mend@localhost:5432/mend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      # Postgres 17 for the database tests, without durability, pulled from CI's GHCR copy, then ECR
      # Public, then mirror.gcr.io (scripts/ci-images.mjs): a `services:` container has one source and
      # GitHub's own three tries, and ECR Public's limits failed it (SLNT-1071).
      - name: Start the throwaway Postgres
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-images.mjs postgres
      - run: pnpm install --frozen-lockfile
      # Firefox needs system packages the runner image lacks, so apt and the downloads both run,
      # each bounded and retried (scripts/ci-bounded.sh): on 16 Nov apt-get update in
      # `install --with-deps` sat for two hours with nothing to stop it (SLNT-1076). The apt
      # wrapper runs as root so its timeout can stop apt-get: as the runner user it could not
      # signal sudo's root apt-get, which kept the dpkg lock and failed every retry (SLNT-1094).
      - name: Install Chromium's and Firefox's system packages for the preview browsers
        run:
          sudo scripts/ci-bounded.sh "Chromium's and Firefox's system packages (apt-get)" 4 3 --
          "$(command -v node)" apps/api/node_modules/playwright-core/cli.js install-deps chromium
          firefox
      - name: Install Chromium and Firefox for the preview browsers
        run:
          scripts/ci-bounded.sh "The Chromium and Firefox download" 4 3 -- pnpm --filter
          @mend/api-server exec playwright-core install chromium firefox
      # The edges' images (apps/api/test/support/preview-edge.ts), through scripts/ci-images.mjs.
      - name: Pull the preview edges' images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-images.mjs pull caddy:2.10-alpine nginx:1.29-alpine
      - name: Preview acceptance through every edge, in real browsers
        run: pnpm --filter @mend/api-server test:preview-acceptance

  # The VS Code extension's real-host acceptance (apps/vscode test:e2e): a real VS Code under Xvfb
  # signs in to a packaged Mend server in Docker-in-Docker, opens sessions over the real Remote-SSH
  # extension and carries an extension to a later session. The server image is built from this
  # commit and set up --offline, so the job needs no secret. A change to the extension selects it
  # (scripts/ci-scope.mjs).
  vscode-e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.vscode != 'false' }}
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    timeout-minutes: 45
    # packages: read lets scripts/ci-images.mjs read CI's image copies on GHCR with the job's token.
    permissions:
      contents: read
      packages: read
    env:
      MEND_TEST_VERSION: 0.0.0-ci
      VSCODE_VERSION: 1.142.0
      MEND_E2E_EVIDENCE: ${{ github.workspace }}/.ci-reports/vscode-e2e
      # CI has no Docker Hub login, so Docker Hub's anonymous pull limit can fail the job. Every
      # image comes from a mirror instead, and a Docker Hub pull fails at once.
      MEND_E2E_REFUSE_DOCKER_HUB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse Docker Hub on this runner
        if: ${{ inputs.runner != 'box' }}
        run:
          echo "0.0.0.0 registry-1.docker.io auth.docker.io index.docker.io" | sudo tee -a
          /etc/hosts
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Pull the images the server build and the acceptance's world name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run:
          node --input-type=module -e 'await (await
          import("./scripts/vscode-remote-world.mjs")).pullWorldImages();'
      - name: Build the server image from this commit
        run:
          docker build -t "ghcr.io/sealant-sh/mend:$MEND_TEST_VERSION" --build-arg
          "MEND_VERSION=$MEND_TEST_VERSION" .
      # Ubuntu 24.04 denies unprivileged user namespaces to unconfined binaries, and Electron's
      # sandbox needs one.
      - name: Install VS Code and Xvfb
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          curl -fsSL "https://update.code.visualstudio.com/$VSCODE_VERSION/linux-x64/stable" -o "$RUNNER_TEMP/vscode.tar.gz"
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP"
          echo "VSCODE_CLI=$RUNNER_TEMP/VSCode-linux-x64/bin/code" >> "$GITHUB_ENV"
          # The Linux launcher detaches; the suite runs in the Electron binary itself.
          echo "VSCODE_BIN=$RUNNER_TEMP/VSCode-linux-x64/code" >> "$GITHUB_ENV"
      - name: VS Code against a Mend server on another address, over Remote-SSH
        run: pnpm --filter ./apps/vscode test:e2e
      - name: Archive the acceptance's evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-e2e-evidence
          path: .ci-reports/vscode-e2e
          if-no-files-found: ignore
          retention-days: 14

  # A pull request whose diff owes `judge` and `run-it` (tooling/verify/obligations.json) carries a
  # receipt for its head in its body, with both passed (AGENTS.md, Run a Feature Before It Merges).
  # It waits for every other job so that it reads the body as late as it can, and it reads the body
  # and labels from the API, never the event payload: receipt-recheck.yml re-runs it, with `checks`
  # after it, when the body is edited or the waiver label changes after this has run. Read-only:
  # the PR's body and its diff, nothing else; no install.
  receipt:
    needs:
      [
        changes,
        static,
        test-engines,
        test-engines-b,
        test-clients-a,
        test-clients-b,
        packaging,
        mobile-web,
        store-image-git,
        formal,
        docker-suites,
        preview-acceptance,
        vscode-e2e,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Require a judged, passed verify receipt in the PR body
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tooling/verify/gate.mjs

  # Retain the required check name. A missing classifier or skipped required job
  # must fail, even when every job that did run passed.
  checks:
    needs:
      [
        changes,
        static,
        test-engines,
        test-engines-b,
        test-clients-a,
        test-clients-b,
        packaging,
        mobile-web,
        store-image-git,
        formal,
        docker-suites,
        preview-acceptance,
        vscode-e2e,
        receipt,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      # The gate reads only `needs`: no checkout, and the runner image's Node runs it.
      - name: Require every selected CI job
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.CI_JOB_RESULTS);
          for (const name of ["changes", "static", "test-engines", "test-engines-b", "test-clients-a", "test-clients-b", "receipt"]) {
            if (jobs[name]?.result !== "success") {
              throw new Error(`${name} must succeed, observed ${jobs[name]?.result ?? "missing"}`);
            }
          }
          for (const [name, output] of [
            ["packaging", "packaging"],
            ["mobile-web", "mobile"],
            ["store-image-git", "store"],
            ["formal", "formal"],
            ["docker-suites", "docker"],
            ["preview-acceptance", "preview"],
            ["vscode-e2e", "vscode"],
          ]) {
            const selected = jobs.changes.outputs?.[output];
            if (selected !== "true" && selected !== "false") {
              throw new Error(`Missing or invalid ${output} selection: ${selected}`);
            }
            const result = jobs[name]?.result;
            if (result !== "success" && !(selected === "false" && result === "skipped")) {
              throw new Error(`${name} was selected=${selected}, observed ${result ?? "missing"}`);
            }
          }
          console.log("All required CI jobs passed.");
          NODE

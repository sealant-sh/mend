# A local nginx edge in front of the preview gateway's tests (ADR 0017): the settings an ingress in
# front of the gateway needs so bodies stream both ways and long-lived requests live. A template:
# startEdge (test/support/preview-edge.ts) fills each @@…@@ placeholder per run and runs it with
# --network host.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    # Named so a test can check that no request or response body is spooled to disk.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 127.0.0.1:@@HTTPS_PORT@@ ssl;
        listen [::1]:@@HTTPS_PORT@@ ssl;
        http2 on;
        server_name *.@@DOMAIN@@ @@DOMAIN@@;
        ssl_certificate /etc/nginx/edge/edge.crt;
        ssl_certificate_key /etc/nginx/edge/edge.key;

        client_max_body_size 0;
        client_body_timeout 600s;

        location / {
            proxy_pass http://127.0.0.1:@@UPSTREAM_PORT@@;
            # HTTP/1.1 upstream: chunked request bodies pass through unbuffered, and upgrades work.
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}

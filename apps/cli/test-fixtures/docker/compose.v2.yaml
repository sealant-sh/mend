# Mend bundle deployment contract v2. The long-running containers are Mend, official Postgres and
# Garage. The Mend image supervises its web/API processes plus the Sealant 0.40.0-next.936 API, worker
# and SSH gateway. Sealant's job queue lives in Postgres and workspace images live in the host
# Docker Engine. Garage is the capture store's bucket (docs/adr/0002-session-capture-store.md):
# every session's work product ships there and the executor is disposable. Generate and persist
# the required values in a private .env file.
name: mend

services:
  mend:
    container_name: ${MEND_CONTAINER_NAME:-mend-mend-1}
    image:
      ${MEND_IMAGE_REPOSITORY:-ghcr.io/sealant-sh/mend}:${MEND_VERSION:?set MEND_VERSION in .env}
    hostname: mend
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      - "${MEND_BIND_HOST:-127.0.0.1}:${MEND_PORT:-3105}:3105"
      # Workspace SSH may be published apart from the web port (`mend server setup --ssh-bind`): an
      # edge keeps 3105 on loopback, and Remote-SSH from another machine still needs 2222.
      - "${MEND_SSH_BIND_HOST:-${MEND_BIND_HOST:-127.0.0.1}}:${MEND_SSH_PORT:-2222}:2222"
    environment:
      APP_URL: ${APP_URL:?set APP_URL in .env}
      MEND_ALLOWED_ORIGINS: ${MEND_ALLOWED_ORIGINS:-[]}
      MEND_SSH_PORT: ${MEND_SSH_PORT:-2222}
      SEALANT_SSH_HOST: ${SEALANT_SSH_HOST:-localhost}
      DATABASE_URL:
        postgresql://mend:${MEND_DB_PASSWORD:?set MEND_DB_PASSWORD in .env}@postgres:5432/mend
      SEALANT_DATABASE_URL:
        postgresql://sealant:${SEALANT_DB_PASSWORD:?set SEALANT_DB_PASSWORD in
        .env}@postgres:5432/sealant_control_plane
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      SEALANT_CREDENTIALS_KEY: ${SEALANT_CREDENTIALS_KEY:?set SEALANT_CREDENTIALS_KEY in .env}
      SEALANT_SERVICE_KEY: ${SEALANT_SERVICE_KEY:?set SEALANT_SERVICE_KEY in .env}
      WORKSPACE_SSH_GATEWAY_TOKEN:
        ${WORKSPACE_SSH_GATEWAY_TOKEN:?set WORKSPACE_SSH_GATEWAY_TOKEN in .env}
      SEALANT_MOUNT_ALLOWED_STORE_ROOTS: /var/lib/mend/store
      # The host VM runtime keeps its base disks and each VM's data disk on the last two volumes.
      SEALANT_DOCKER_VOLUME_MAPPINGS: >-
        [{"logicalRoot":"/var/lib/mend/store","volumeName":"${MEND_STORE_VOLUME_NAME:-mend-store}"},{"logicalRoot":"/run/sealant/sockets","volumeName":"${MEND_CONTROL_VOLUME_NAME:-mend-control}"},{"logicalRoot":"/var/lib/mend/vm-images","volumeName":"${MEND_VM_IMAGES_VOLUME_NAME:-mend-vm-images}"},{"logicalRoot":"/var/lib/mend/vm-data","volumeName":"${MEND_VM_DATA_VOLUME_NAME:-mend-vm-data}"}]
      # Each workspace gets a /28 network of its own from this range, behind a guard that refuses
      # the private ranges, so it reaches neither Postgres, Garage's admin port nor another
      # workspace. Workspaces no longer join mend_default.
      SEALANT_DOCKER_WORKSPACE_EGRESS_SUBNETS: ${MEND_WORKSPACE_EGRESS_SUBNETS:-10.233.0.0/16}
      # Interim: Mend and Garage join every workspace's network as `mend` and `garage`, so the
      # session channel (mend:3106) and captures (garage:3900) still answer there. Once sealant
      # reports an executor's control scope, capture.sock and session.sock replace this.
      SEALANT_DOCKER_WORKSPACE_MIRROR_CONTAINERS: ${MEND_CONTAINER_NAME:-mend-mend-1}:mend,${MEND_GARAGE_CONTAINER_NAME:-mend-garage-1}:garage
      # Private addresses workspaces may still reach behind that guard, and the host's public
      # addresses it refuses; both empty by default. Mend reads the first as the ceiling of what an
      # Access policy may allow.
      MEND_OPERATOR_ALLOWED_PRIVATE_EGRESS: ${MEND_OPERATOR_ALLOWED_PRIVATE_EGRESS:-}
      MEND_HOST_PUBLIC_IPS: ${MEND_HOST_PUBLIC_IPS:-}
      # sealant creates one private caller network per organization's Executor; 4401 is never published.
      SEALANT_RESOURCE_CALLERS: >-
        [{"kind":"docker","name":"mend","container":"${MEND_CONTAINER_NAME:-mend-mend-1}","callbackPorts":[4401]}]
      MEND_EXECUTOR_RUNTIME: docker
      MEND_EXECUTOR_CALLER: mend
      MEND_EXECUTOR_CALLBACK_HOST: ${MEND_CONTAINER_NAME:-mend-mend-1}
      # The capture store (ADR-0002): the session channel executors call, and the bucket their
      # presigned URLs name. Workspaces resolve both on their own networks, by the aliases above.
      MEND_SESSION_ENDPOINT_LISTEN: 0.0.0.0:3106
      MEND_SESSION_ENDPOINT_URL: http://mend:3106
      MEND_BLOB_STORE: s3://mend?endpoint=http://garage:3900&region=garage
      MEND_BLOB_STORE_PUBLIC_URL: http://garage:3900
      AWS_ACCESS_KEY_ID: ${MEND_GARAGE_KEY_ID:?set MEND_GARAGE_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${MEND_GARAGE_KEY_SECRET:?set MEND_GARAGE_KEY_SECRET in .env}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - mend-store:/var/lib/mend/store
      - mend-control:/run/sealant/sockets
      - mend-vm-images:/var/lib/mend/vm-images
      - mend-vm-data:/var/lib/mend/vm-data
      - mend-config:/var/lib/mend/config
      - mend-ssh:/var/lib/mend/ssh

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MEND_POSTGRES_ADMIN_PASSWORD:?set MEND_POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      MEND_DB_PASSWORD: ${MEND_DB_PASSWORD:?set MEND_DB_PASSWORD in .env}
      SEALANT_DB_PASSWORD: ${SEALANT_DB_PASSWORD:?set SEALANT_DB_PASSWORD in .env}
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/10-mend-databases.sh
    volumes:
      - mend-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U postgres -d postgres && test "$$(psql -U postgres -d postgres -tAc "SELECT
          count(*) FROM pg_database WHERE datname IN ('mend','sealant_control_plane')")" = "2" &&
          PGPASSWORD="$${MEND_DB_PASSWORD}" psql -h 127.0.0.1 -U mend -d mend -tAc "SELECT 1"
          >/dev/null && PGPASSWORD="$${SEALANT_DB_PASSWORD}" psql -h 127.0.0.1 -U sealant -d
          sealant_control_plane -tAc "SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # The capture store's bucket: Garage in single-node mode, S3 on 3900 for the Compose network
  # only (no host port). Its secrets come from the environment, so the config below carries none;
  # `mend server setup` lays the node out and creates bucket `mend` and the key once. Idle
  # footprint ≈ 7.5 MiB (measured 2026-09-13).
  garage:
    image: dxflrs/garage:v2.4.1
    # Named, so Sealant can join it to each workspace's network (SEALANT_DOCKER_WORKSPACE_MIRROR_CONTAINERS).
    container_name: ${MEND_GARAGE_CONTAINER_NAME:-mend-garage-1}
    hostname: garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${MEND_GARAGE_RPC_SECRET:?set MEND_GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${MEND_GARAGE_ADMIN_TOKEN:?set MEND_GARAGE_ADMIN_TOKEN in .env}
    configs:
      - source: garage-config
        target: /etc/garage.toml
    volumes:
      - mend-garage:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

configs:
  postgres-init:
    file: ./postgres-init.sh
  garage-config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"
      [admin]
      api_bind_addr = "[::]:3903"

volumes:
  # Setup claims these volumes before Compose starts, so a different installation cannot
  # silently replace credentials while adopting existing data. `mend-garage` holds every
  # session's captures — it is data, owned like the store.
  mend-store:
    external: true
    name: ${MEND_STORE_VOLUME_NAME:-mend-store}
  mend-control:
    external: true
    name: ${MEND_CONTROL_VOLUME_NAME:-mend-control}
  mend-garage:
    external: true
    name: ${MEND_GARAGE_VOLUME_NAME:-mend-garage}
  mend-config:
  mend-ssh:
  mend-postgres:
  # The host VM runtime's disks. Named as in SEALANT_DOCKER_VOLUME_MAPPINGS, which Sealant mounts
  # by the volume's Docker name. Compose owns them: setup claims none of them.
  mend-vm-images:
    name: ${MEND_VM_IMAGES_VOLUME_NAME:-mend-vm-images}
  mend-vm-data:
    name: ${MEND_VM_DATA_VOLUME_NAME:-mend-vm-data}
